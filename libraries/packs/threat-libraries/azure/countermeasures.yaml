- id: queue-entra-rbac
  name: Entra-ID-Autorisierung für Queue-Zugriffe
  description: 'Managed Identities mit den Rollen Storage Queue Data Message Sender, Processor oder Reader pro Queue vergeben, Shared Key deaktivieren. Quelle: Secure-Queue-Storage (Identity and access management 1–2), Authorize-data-access (Shared Key: disallow).'
  control_functions: [preventive]
  cost: low
- id: queue-network-restriction
  name: Netzwerkzugang auf Queue-Konten einschränken
  description: 'Firewall-Regeln setzen, Private Endpoints nutzen und VNet-Service-Tags einsetzen. Quelle: Security-recommendations-Queue-Storage (Networking: firewall, private endpoints, service tags).'
  control_functions: [preventive]
  cost: low
- id: queue-sas-least-privilege
  name: SAS auf eine Queue und minimale Operationen begrenzen
  description: 'SAS nur mit den nötigen Rechten (add, update, process, read) ausstellen, über HTTPS, mit Laufzeit ≤ 1 Stunde oder gespeicherter Zugriffsrichtlinie. Quelle: Security-recommendations-Queue-Storage (SAS-Empfehlungen).'
  control_functions: [preventive]
  cost: low
- id: sa-customer-managed-key
  name: Customer-Managed Key for Storage Encryption at Rest
  description: 'Use a key in Azure Key Vault or Managed HSM as the account encryption key, with rotation and access audit owned by the organization. Verification: Storage accounts should use customer-managed key for encryption. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 DP-5; Secure your Azure Storage account, „Data protection“ / „Configure customer-managed keys (CMK) for encryption at rest“.'
  control_functions: [preventive]
  cost: medium
- id: sa-defender-for-storage
  name: Microsoft Defender for Storage Enabled
  description: 'Enable Defender for Storage with malware scanning on blob uploads where untrusted content is accepted and sensitive data discovery. Verification: Azure Defender for Storage should be enabled. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 LT-1, LT-4; Secure your Azure Storage account, „Logging and monitoring“ / „Enable Microsoft Defender for Storage“.'
  control_functions: [detective]
  cost: medium
- id: sa-diagnostic-settings
  name: Storage Diagnostic Settings to Log Analytics
  description: 'Configure diagnostic settings on the account and each data service to send StorageRead, StorageWrite and StorageDelete logs and metrics to Log Analytics. Detection example: alert on Shared Key or anonymous requests on accounts where those are disallowed. Verification: diagnostic setting with StorageRead, StorageWrite and StorageDelete present on the account and each data service (az monitor diagnostic-settings list). Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 LT-1, LT-4; Secure your Azure Storage account, „Logging and monitoring“ / „Send diagnostic settings to a Log Analytics workspace“.'
  control_functions: [detective]
  cost: low
- id: sa-disable-public-access
  name: Storage Account Public Network Access Disabled
  description: 'Set public network access to Disabled and use private endpoints, or restrict the firewall default action to Deny with explicit IP and subnet rules. Verification: Storage accounts should disable public network access. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Disable public network access to the storage account“.'
  control_functions: [preventive]
  cost: low
- id: sa-disallow-shared-key
  name: Shared Key Authorization Disallowed
  description: 'Set allowSharedKeyAccess to false so that only Microsoft Entra ID and user-delegation SAS requests are accepted. Verification: Storage accounts should prevent shared key access. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Disallow Shared Key authorization“.'
  control_functions: [preventive]
  cost: low
- id: sa-immutability-and-soft-delete
  name: Immutability and Soft Delete for Data Services
  description: 'Use the data-service recovery features (blob soft delete, versioning, immutability policies, file share soft delete) because geo-redundancy replicates deletions and corruption. Verification: soft delete and versioning enabled on blob and file services; immutability policy on regulated containers. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 BR-2; Secure your Azure Storage account, „Backup and recovery“ / „Don''t rely on geo-redundancy for ransomware protection“.'
  control_functions: [recovery]
  cost: medium
- id: sa-least-privilege-rbac
  name: Storage Data Roles at the Smallest Scope
  description: 'Assign built-in data-plane roles at container, share, queue or table scope and add ABAC conditions where path or tag restrictions are needed. Verification: no data-plane role assignment at account or subscription scope except for documented administrators. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Assign RBAC roles at the smallest reasonable scope“.'
  control_functions: [preventive]
  cost: low
- id: sa-resource-lock
  name: Resource Lock on the Storage Account
  description: 'Apply a CanNotDelete or ReadOnly lock to the account. The lock protects the account resource, not the data inside it. Verification: resource lock present on each production storage account (az lock list). Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 DP-5; Secure your Azure Storage account, „Data protection“ / „Protect the storage account with a resource lock“.'
  control_functions: [preventive]
  cost: low
- id: sa-restrict-copy-scope
  name: Copy and Object Replication Limited to Allowed Tenants
  description: 'Restrict copy and object replication to source accounts in the same tenant or on an allow list, and prevent object replication across tenants. Verification: permitted copy scope set to same tenant or allow list on every account. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Restrict cross-tenant object replication and copy operations“.'
  control_functions: [preventive]
  cost: low
- id: sa-sas-expiration-policy
  name: SAS Expiration Policy on the Account
  description: 'Configure an SAS expiration policy on the account so that violations are logged and long-lived SAS tokens are found and fixed. Verification: sasExpirationPolicy set on the account; violations present in storage logs. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Configure a SAS expiration policy on the account“.'
  control_functions: [detective]
  cost: low
- id: sa-secure-transfer-tls12
  name: Secure Transfer Required and Minimum TLS 1.2
  description: 'Enable secure transfer required and set the minimum TLS version to 1.2 so that the account rejects HTTP and older TLS versions. Verification: Secure transfer to storage accounts should be enabled. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Require secure transfer (HTTPS)“.'
  control_functions: [preventive]
  cost: low
- id: sa-user-delegation-sas
  name: User-Delegation SAS Instead of Account-Key SAS
  description: 'Issue SAS tokens signed with a Microsoft Entra user delegation key, scoped to minimum permissions and an expiry of one hour or less for service SAS without a stored access policy. Verification: no SAS in logs with signature type account-key; SAS lifetime within the defined maximum. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Use user-delegation SAS instead of service or account SAS when SAS is required“.'
  control_functions: [preventive]
  cost: low
- id: sentinel-connector-coverage
  name: Datenkonnektoren für sicherheitsrelevante Quellen aktivieren
  description: 'Konnektoren für Identität, Endpunkte, Netzwerk und Cloud-Plattformen aktivieren. Filterung nur dort, wo nötig, weil sie UEBA und Fusion einschränkt. Quelle: Sentinel-Best-practices-data (Alternative data ingestion) und Sentinel-Overview (Datenkonnektoren).'
  control_functions: [detective]
  cost: low
- id: sentinel-rule-change-control
  name: Änderungen an Analytics-Regeln überwachen und versionieren
  description: 'Regeln als ARM-Template exportieren und versionieren, Änderungen und Deaktivierungen per Audit verfolgen. Quelle: Threat-detection in Sentinel (Export rules to an ARM template, Auto-disable bei fehlendem Zugriff).'
  control_functions: [detective, preventive]
  cost: low
- id: sentinel-watchlist-hygiene
  name: Watchlists nach der Untersuchung löschen
  description: 'Watchlists mit sensiblen Daten nur für die Dauer der Untersuchung anlegen und danach löschen. Quelle: Best-practices (Watchlists: „delete them when your investigation is done“).'
  control_functions: [preventive]
  cost: low
- id: sf-cert-expiry-monitoring
  name: Ablauf der Clientzertifikate überwachen
  description: 'Ablaufdaten der Clientzertifikate überwachen, Zertifikate nicht teilen und regelmäßig erneuern. Quelle: Architecture-best-practices-Service-Fabric (Create a process to monitor expiration); Service-Fabric-cluster-security-scenarios (Client-to-node).'
  control_functions: [detective]
  cost: low
- id: sf-network-isolation
  name: Netzwerkisolation für Service-Fabric-Cluster
  description: 'NSGs und Jump-Server für Verwaltungszugriffe einsetzen, Perimeter-Netze anlegen. Quelle: Best-practices-for-Azure-Service-Fabric-security (Use network isolation and security).'
  control_functions: [preventive]
  cost: low
- id: sf-secure-cluster-x509-entra
  name: Service-Fabric-Cluster mit Zertifikat und Entra ID sichern
  description: 'Sicherheit bei der Erstellung mit X.509-Zertifikaten einrichten und Clientzugriffe über Microsoft Entra ID führen. Quelle: Best-practices-for-Azure-Service-Fabric-security (Use X.509 certificates); Service-Fabric-cluster-security-scenarios.'
  control_functions: [preventive]
  cost: low
- id: sm-least-privilege-target
  name: Agenten-Rollen am Ziel auf das Minimum beschränken
  description: 'Agenten nur die Rollen am konkreten Container oder Share geben, die der Job braucht, und Owner-Rechte nur für die Zuweisung im Job-Start verwenden. Quelle: Storage-Mover „How to register an agent“ (Just-in-time-Autorisierung).'
  control_functions: [preventive]
  cost: low
- id: sm-private-control-plane
  name: Privates Netz für Storage Mover (ExpressRoute Microsoft Peering)
  description: 'Öffentlich erreichbare Dienste über ExpressRoute Microsoft Peering führen, Private Link für Datenpfade nutzen. Quelle: Storage-Mover „Public endpoint dependencies“ und „Private networking requirements“.'
  control_functions: [preventive]
  cost: low
- id: sm-remove-agent-access
  name: Agenten-Zugriff nach Abschluss entfernen
  description: 'Nach jedem Job die Rollenzuweisungen des Agenten am Ziel entfernen oder den Agenten unregistrieren und die Azure-Arc-Ressource löschen. Quelle: Storage-Mover „Decommissioning an agent“ und „How to register an agent“ (Warning: Autorisierung bleibt bestehen).'
  control_functions: [preventive]
  cost: low
- id: subnet-flow-logs
  name: NSG-Flow-Logs auf jedem Subnetz
  description: 'Flow-Logs auf jeder subnetzbezogenen NSG aktivieren und in Log Analytics auswerten. Quelle: VNets-and-Subnets-Design-Guide (Flow logs for visibility), Network-Watcher-NSG-Flow-Logs.'
  control_functions: [detective]
  cost: low
- id: subnet-nsg-deny-default
  name: NSG auf jedem Subnetz mit Deny-by-Default
  description: 'Jedem Subnetz eine NSG zuordnen, nur die rollenbedingt nötigen Regeln erlauben und sonst verweigern. Quelle: VNets-and-Subnets-Design-Guide (NSG auf jedem Subnetz, deny by default).'
  control_functions: [preventive]
  cost: low
- id: subnet-restrict-allow-rules
  name: Allow-Regeln eng fassen und Application Security Groups nutzen
  description: 'Keine Allow-Regeln mit weiten Bereichen, Service Tags und Application Security Groups verwenden. Quelle: Azure-Network-Security-Best-Practices (Logically segment subnets: keine breiten Allow-Regeln, ASGs).'
  control_functions: [preventive]
  cost: low
- id: tm-alias-records
  name: Alias-Records für Traffic-Manager-Endpunkte
  description: 'Azure-DNS-Alias-Records verwenden, deren Lebensdauer an die Azure-Ressource gekoppelt ist. Quelle: Architecture-best-practices-Traffic-Manager (Prevent dangling DNS entries).'
  control_functions: [preventive]
  cost: low
- id: tm-https-monitoring
  name: HTTPS für Endpunktüberwachung
  description: 'HTTPS als Protokoll für Health Probes von Webendpunkten wählen. Quelle: Secure-your-Azure-Traffic-Manager-deployment (Network security 2).'
  control_functions: [preventive]
  cost: low
- id: tm-rbac-profiles
  name: RBAC auf Traffic-Manager-Profile beschränken
  description: 'Schreibrechte auf Profile und Endpunkte nur autorisierten Identitäten geben. Quelle: Architecture-best-practices-Traffic-Manager (Security: RBAC on the control plane).'
  control_functions: [preventive]
  cost: low
- id: vm-backup-immutable
  name: Immutable Azure Backup for VMs
  description: 'Protect VMs with Azure Backup in a vault with immutability and soft delete, multi-user authorization for backup deletion, and cross-region restore. Test restores on a schedule. Quelle: MCSB v2 BR-1, BR-2.'
  control_functions: [recovery]
  cost: medium
- id: vm-brute-force-detection
  name: Failed Logon Detection for VM Management Ports
  description: 'Collect Windows Security events (4625, 4624) and Linux auth logs into Sentinel or Log Analytics. Detection: more than 20 failed logons from one source IP within 10 minutes, or a successful logon from an IP that had recent failures. Enforce account lockout policy. Quelle: MCSB v2 LT-1, NS-8.'
  control_functions: [detective]
  cost: low
- id: vm-disk-export-control
  name: Disk Encryption and Snapshot Export Control
  description: 'Enable encryption at host or Azure Disk Encryption with customer-managed keys. Set publicNetworkAccess to Disabled on disks and snapshots, use Disk Access with private endpoints, and restrict or alert on snapshot SAS export operations (Microsoft.Compute/snapshots/beginGetAccess). Quelle: MCSB v2 DP-4, DP-5.'
  control_functions: [preventive]
  cost: medium
- id: vm-edr-antimalware
  name: Microsoft Defender for Servers with EDR and Antimalware
  description: 'Deploy Microsoft Defender for Servers (Plan 2) with Defender for Endpoint EDR and Defender Antivirus on all VMs. Enable tamper protection and attack surface reduction rules. Detection: alert when a sensor reports as offline or tamper protection is disabled. Quelle: MCSB v2 ES-1, ES-2.'
  control_functions: [preventive, detective]
  cost: medium
- id: vm-extension-allowlist
  name: VM Extension Allowlist and Extension Monitoring
  description: 'Restrict VM extensions with an Azure Policy allowlist, and deny Custom Script Extension for untrusted sources. Detection: Activity Log events Microsoft.Compute/virtualMachines/extensions/write from identities outside the deployment pipeline. Quelle: MCSB v2 PV-4, AM-5.'
  control_functions: [preventive, detective]
  cost: low
- id: vm-patch-management
  name: Patch Management and Vulnerability Assessment
  description: 'Use Azure Update Manager or an equivalent patch service with a defined SLA per severity (for example, critical within 14 days). Enable Defender vulnerability assessment and Trusted Launch (Secure Boot, vTPM) on supported images. Use hardened gallery images with CIS benchmarks. Quelle: MCSB v2 PV-5, PV-6.'
  control_functions: [preventive]
  cost: low
- id: vm-restrict-management-ports
  name: No Public RDP or SSH; Bastion and Just-in-Time Access
  description: 'Remove public IPs or NSG rules that expose TCP 3389 and 22 to the internet. Use Azure Bastion or Microsoft Defender for Servers just-in-time access for administration, and require Entra ID login for Windows and Linux VMs where supported. Quelle: MCSB v2 NS-8, NS-1.'
  control_functions: [preventive]
  cost: low
- id: vm-secure-baseline
  name: Guest Configuration Secure Baseline
  description: 'Assign Azure Policy guest configuration (machine configuration) baselines for Windows and Linux VMs, based on CIS benchmarks. Detection: non-compliant guest configuration assignments are reported in Defender for Cloud and alerted. Quelle: MCSB v2 PV-3, PV-4.'
  control_functions: [preventive, detective]
  cost: medium
- id: vmss-application-health
  name: Application Health für Scale Sets
  description: 'Die Application Health Extension oder eine Health Probe konfigurieren, damit fehlerhafte Instanzen erkannt werden. Quelle: Using-Application-Health-extension-with-VMSS; Upgrade-policy-modes (Rolling upgrade).'
  control_functions: [detective]
  cost: low
- id: vmss-automatic-os-upgrade
  name: Automatische OS-Image-Upgrades für Scale Sets
  description: 'Automatische OS-Image-Upgrades oder Rolling Upgrades mit Application Health aktivieren. Quelle: Azure-VMSS-automatic-OS-image-upgrades; Azure-security-baseline-VMSS (Posture and vulnerability management).'
  control_functions: [preventive]
  cost: low
- id: vmss-instance-protection
  name: Instanzschutz für besondere Scale-Set-Instanzen
  description: 'protectFromScaleIn und protectFromScaleSetActions für Instanzen setzen, die nicht verändert werden dürfen. Quelle: Instance-Protection-for-VMSS-instances.'
  control_functions: [preventive]
  cost: low
- id: vnet-ddos-protection
  name: DDoS Network Protection auf VNets mit öffentlichen IPs
  description: 'DDoS-Schutzplan mit allen VNets verknüpfen, die öffentliche IP-Adressen tragen. Quelle: DDoS-Protection-Fundamental-Best-Practices (DDoS Network Protection), Secure-DDoS-Protection (Protect every supported public IP).'
  control_functions: [preventive]
  cost: low
- id: vnet-private-endpoints
  name: PaaS über Private Endpoints statt öffentlicher IPs anbinden
  description: 'PaaS-Dienste über Private Endpoints im VNet anbinden und den öffentlichen Zugang deaktivieren. Quelle: Architecture-best-practices-Azure-Virtual-Network (Security).'
  control_functions: [preventive]
  cost: low
- id: vnet-service-endpoint-scope
  name: Service-Endpoints nur gezielt aktivieren
  description: 'Service-Endpoints nicht pauschal auf allen Subnetzen aktivieren, sondern nur dort, wo Private Endpoints nicht möglich sind, und mit Zielbeschränkung. Quelle: Mission-critical-security (Network intrusion protection 10–10.1).'
  control_functions: [preventive]
  cost: low
- id: vwan-custom-route-tables
  name: Benutzerdefinierte Routentabellen für Segmentierung
  description: 'Routentabellen je Sicherheitszone anlegen, Assoziationen und Propagationen setzen, bei vollständiger Isolierung die Assoziation auf None. Quelle: Architecture-Best-Practices-Virtual-WAN (Configuration recommendations: custom route tables).'
  control_functions: [preventive]
  cost: low
- id: vwan-p2s-entra-auth
  name: Point-to-Site mit Entra-ID-Authentifizierung und Conditional Access
  description: 'P2S-VPN mit Microsoft Entra ID authentifizieren, Conditional Access, MFA und Gerätecompliance erzwingen. Quelle: Architecture-Best-Practices-Virtual-WAN (Security 4).'
  control_functions: [preventive]
  cost: low
- id: vwan-restrict-udr-permissions
  name: UDR-Zuweisungsrechte auf Netzwerkadministratoren beschränken
  description: 'Das Recht zum Zuweisen von Routentabellen (routeTables/join) nur zentralen Netzwerkadministratoren geben, nicht den Landing-Zone-Ownern. Quelle: Zero-Trust-Virtual-WAN (Step 3: RBAC-Rechte für UDRs).'
  control_functions: [preventive]
  cost: low
- id: waf-diagnostic-logs
  name: Diagnoseprotokolle der WAF an Sentinel oder SIEM
  description: 'WAF-Logs und Metriken an Log Analytics senden und mit Microsoft Sentinel verbinden. Quelle: Secure-your-Azure-WAF-deployment (Logging and monitoring 1–2).'
  control_functions: [detective]
  cost: low
- id: waf-prevention-mode
  name: WAF im Prevention-Modus betreiben
  description: 'Nach dem Tuning im Erkennungsmodus den Prevention-Modus aktivieren. Quelle: WAF-Best-practices-Front-Door (Use prevention mode).'
  control_functions: [preventive]
  cost: low
- id: waf-rate-limit-bot
  name: Ratenlimit und Bot-Schutz für WAF
  description: 'Ratenlimitregeln pro Client-IP und den Bot-Manager-Regelsatz aktivieren. Quelle: Secure-your-Azure-WAF-deployment (Network security 6–7: rate limiting, bot protection).'
  control_functions: [preventive]
  cost: low
