countermeasures:
- id: aci-keyvault-secrets
  name: Secrets über Key Vault und Managed Identity beziehen
  description: 'Zugangsdaten nicht über die CLI übergeben, sondern aus Key Vault mit der Managed Identity der Container-Gruppe lesen. Quelle: Best-practices-and-considerations-ACI; Use-managed-identities-with-ACI.'
  control_functions: [preventive]
  cost: low
- id: aci-least-privilege-runtime
  name: Container ohne unnötige Rechte betreiben
  description: 'Container nicht als root oder privilegiert ausführen, nur benötigte Prozesse und Dateien erlauben. Quelle: Security-considerations-ACI (Considerations for the container ecosystem).'
  control_functions: [preventive]
  cost: low
- id: aci-private-registry-scan
  name: Private Registry und Image-Scanning
  description: 'Images aus einer privaten Registry wie Azure Container Registry beziehen und mit Schwachstellen-Scanning prüfen. Quelle: Security-considerations-ACI (Use a private registry; monitor and scan container images).'
  control_functions: [preventive, detective]
  cost: low
- id: aci-vnet-nsg
  name: Container-Gruppen in VNet mit NSG betreiben
  description: 'Container-Gruppen in ein VNet einbinden, NSG-Regeln für das Subnetz setzen und für ausgehenden Verkehr ein NAT-Gateway verwenden. Quelle: Security-baseline-ACI (NS-1: Deploy into VNet; NSG); Best-practices-ACI (NAT-Gateway for VNet).'
  control_functions: [preventive]
  cost: low
- id: acr-disable-admin-user
  name: Admin-Account der Container Registry deaktivieren
  description: 'Admin-Account deaktivieren und Entra-Identitäten mit rollenbasierten Rechten verwenden. Quelle: Secure-your-ACR-deployment („Keep the admin account disabled“).'
  control_functions: [preventive]
  cost: low
- id: acr-disable-anonymous-pull
  name: Anonymous Pull in Container Registry deaktivieren
  description: 'Anonymous Pull nur für ausdrücklich öffentliche Registries aktivieren. Quelle: Secure-your-ACR-deployment („Identity and access“: Anonymous pull access disabled).'
  control_functions: [preventive]
  cost: low
- id: acr-private-endpoint
  name: Private Endpoint und öffentlichen Zugriff deaktivieren (Container Registry)
  description: 'Private Endpoint einrichten und den öffentlichen Netzwerkzugriff deaktivieren. Quelle: Secure-your-ACR-deployment („Network security“, 1–2); Policy „Public network access should be disabled for Container registries“.'
  control_functions: [preventive]
  cost: low
- id: adls-disable-anonymous-read
  name: Anonymen Lesezugriff auf Data Lake deaktivieren
  description: 'Anonymen Lesezugriff auf Container ausschalten, Autorisierung für alle Anforderungen verlangen. Quelle: Known-issues-ADLS (Access control lists and anonymous read access).'
  control_functions: [preventive]
  cost: low
- id: adls-group-based-acls
  name: ACLs über Entra-Gruppen steuern, RBAC für grobe Rechte
  description: 'Entra-Sicherheitsgruppen als ACL-Principal verwenden und Standard-ACLs auf Verzeichnisse setzen. Quelle: Access-control-lists-ADLS (FAQ: Entra-Gruppen als ACL-Principal), Secure-Blob-Storage (RBAC grob, ACL fein).'
  control_functions: [preventive]
  cost: low
- id: adls-private-endpoints-blob-dfs
  name: Private Endpoints für blob und dfs
  description: 'Für Data Lake Storage jeweils einen Private Endpoint für die blob- und dfs-Sub-Ressource anlegen. Quelle: Known-issues-ADLS (Private endpoints for Azure Data Lake Storage).'
  control_functions: [preventive]
  cost: low
- id: afs-ad-ds-identity
  name: AD-DS-Identität für Azure-Files-Freigaben
  description: 'Das Speicherkonto der Domäne beitreten lassen, damit AD-DS-Berechtigungen auch in der Cloud gelten. Quelle: Hybrid-file-services (Considerations 2: domain join storage account).'
  control_functions: [preventive]
  cost: low
- id: afs-azure-files-backup
  name: Azure-Files-Backup für Freigaben
  description: 'Azure Files Backup mit Snapshots und Tresor-Backups für die Freigaben einrichten. Quelle: Hybrid-file-services (Considerations 5).'
  control_functions: [recovery]
  cost: low
- id: afs-private-endpoints
  name: Private Endpoints für Azure Files und Azure File Sync
  description: 'Private Endpoints für Storage-Konto und Storage Sync Service einrichten und den öffentlichen Zugang deaktivieren. Quelle: Networking-considerations-for-Azure-File-Sync (Private endpoints for Azure Files and Azure File Sync).'
  control_functions: [preventive]
  cost: low
- id: agw-end-to-end-tls
  name: Ende-zu-Ende-TLS zum Backend
  description: 'Backend-HTTP-Einstellungen auf HTTPS setzen und das Backend-Zertifikat oder die Root-CA hinterlegen. Quelle: Configure-end-to-end-TLS-Application-Gateway; Architecture-best-practices-Application-Gateway-v2 (Protect data in transit).'
  control_functions: [preventive]
  cost: low
- id: agw-least-privilege-rbac
  name: Least-Privilege-Rollen für Application Gateway
  description: 'Verwaltungsrechte auf die Ressourcengruppe oder den Gateway beschränken, Conditional Access für Administratoren, Zugriffsüberprüfung. Quelle: Secure-Application-Gateway (Identity and access management 2–6).'
  control_functions: [preventive]
  cost: low
- id: agw-tls-policy
  name: Aktuelle TLS-Richtlinie am Application Gateway
  description: 'Die neueste vordefinierte TLS-Richtlinie setzen, die TLS 1.2 und stärkere Chiffren erzwingt. Quelle: Architecture-best-practices-Application-Gateway-v2 (Security: TLS policy).'
  control_functions: [preventive]
  cost: low
- id: agw-waf-v2-prevention
  name: WAF v2 im Prevention-Modus
  description: 'WAF v2 aktivieren, Standard-Regelsatz (DRS 2.2) verwenden und nach Tuning in den Prevention-Modus wechseln. Quelle: Secure-Application-Gateway (Web application protection 1, 3, 4).'
  control_functions: [preventive]
  cost: low
- id: ai-content-filtering
  name: Mehrstufige Inhaltsfilterung und Sicherheits-Meta-Prompts
  description: 'Eingaben mit Prompt Shields und Azure AI Content Safety prüfen, Ausgaben filtern und Meta-Prompts einsetzen. Quelle: Azure-AI-security-best-practices (Implement multilayered content filtering; safety meta-prompts).'
  control_functions: [preventive]
  cost: low
- id: ai-managed-identity-auth
  name: Managed Identity statt API-Schlüssel für AI Services
  description: 'Anwendungen mit Microsoft-Entra-Managed-Identity authentifizieren und API-Schlüssel deaktivieren. Quelle: Azure-AI-security-best-practices (Secure Azure OpenAI Service deployments, 2).'
  control_functions: [preventive]
  cost: low
- id: ai-private-endpoint
  name: Private Endpoints für AI-Dienste
  description: 'Private Endpoints für alle AI-Plattformdienste einrichten und den öffentlichen Zugang einschränken. Quelle: Configure-secure-networking-for-Azure-AI-platform-services (Create private endpoints for all AI platform services).'
  control_functions: [preventive]
  cost: low
- id: anf-cmk-encryption
  name: Customer-Managed Keys for ANF Volumes
  description: 'Use customer-managed keys in Azure Key Vault for encryption of Azure NetApp Files volumes, with purge protection and key rotation. Monitor key vault access logs for unexpected key use. Quelle: MCSB v2 DP-5.'
  control_functions: [preventive]
  cost: medium
- id: anf-diagnostic-logging
  name: ANF and Network Flow Logging
  description: 'Enable diagnostic settings for ANF accounts and NSG flow logs for the delegated subnet. Detection: alert on export policy changes and on mount activity from hosts outside the approved client list. Quelle: MCSB v2 LT-4.'
  control_functions: [detective]
  cost: low
- id: anf-export-policy-kerberos
  name: NFS Export Policy Restriction and Kerberos
  description: 'Restrict ANF export policy rules to specific client hosts or subnets with read-only default and no root access where possible. Use NFSv4.1 with Kerberos (krb5p) for authentication and encryption instead of AUTH_SYS, which trusts client-supplied UIDs. Quelle: MCSB v2 NS-2, IM-7.'
  control_functions: [preventive]
  cost: medium
- id: anf-immutable-backup-lock
  name: Backup Vault Immutability and Resource Locks
  description: 'Use an ANF backup vault with immutability or vault locks, cross-region backup copies, and CanNotDelete resource locks on capacity pools and volumes. Separate backup administration from storage administration so one Contributor cannot remove all recovery points. Quelle: MCSB v2 BR-2.'
  control_functions: [preventive, recovery]
  cost: medium
- id: anf-permission-model-review
  name: Single Security Style and ACL Validation
  description: 'Choose one security style per dual-protocol volume (NTFS or UNIX) and document the mapping. After permission changes, validate effective access from both SMB and NFS clients. Review periodically with a script that compares ACLs and mode bits. Quelle: MCSB v2 IM-7, PA-7.'
  control_functions: [preventive]
  cost: low
- id: anf-snapshot-delete-alert
  name: Snapshot and Volume Deletion Alerts
  description: 'Create Activity Log alerts for delete operations on ANF volumes, snapshots, and backup vaults. Detection: any delete outside a change window, or more than three deletes by one principal within 15 minutes. Quelle: MCSB v2 LT-1.'
  control_functions: [detective]
  cost: low
- id: apic-least-privilege-keyvault
  name: Key Vault Secrets User nur für die API-Center-Identität
  description: 'Der Managed Identity des API Centers nur die Rolle Key Vault Secrets User auf dem konkreten Key Vault geben. Quelle: Authorize-access-to-APIs-in-API-Center (Option 1–2, Key Vault Secrets User).'
  control_functions: [preventive]
  cost: low
- id: apic-register-all-apis
  name: Alle APIs im API-Center-Inventar registrieren
  description: 'Alle APIs, auch nicht verwaltete und in Entwicklung, im Inventar führen und Governance-Regeln anwenden. Quelle: Azure-API-Center-Overview (Create and maintain an organizational inventory).'
  control_functions: [preventive]
  cost: low
- id: apic-scope-credential-access
  name: Credential-Zugriff im API Center pro Benutzer oder Gruppe vergeben
  description: 'Die Rolle API Center Credential Access Reader gezielt pro Authentifizierungskonfiguration an Benutzer oder Gruppen vergeben, OAuth 2.0 mit PKCE bevorzugen. Quelle: Authorize-access-to-APIs-in-API-Center (Manage access for specific users or groups; PKCE recommended).'
  control_functions: [preventive]
  cost: low
- id: appi-entra-authentication
  name: Microsoft-Entra-Authentifizierung für Application Insights
  description: 'Telemetrie-Ingestion über Microsoft Entra ID authentifizieren und lokale Authentifizierung abschalten. Quelle: Connection-strings-in-Application-Insights (Microsoft Entra authentication for Application Insights).'
  control_functions: [preventive]
  cost: low
- id: appi-scrub-sensitive-telemetry
  name: Sensible Werte aus Telemetrie entfernen
  description: 'Log-Scrubbing und Transformationen für Telemetrie einsetzen, sensible Felder ausblenden und Daten bei Fund löschen. Quelle: Best-practices-Azure-Monitor-Logs (Purge sensitive data; transformations).'
  control_functions: [preventive]
  cost: low
- id: appi-secret-references
  name: Verbindungszeichenfolge über Umgebungsvariablen oder Key Vault
  description: 'Die Verbindungszeichenfolge über die Umgebungsvariable APPLICATIONINSIGHTS_CONNECTION_STRING bereitstellen, nicht im Code. Quelle: Application-Insights-FAQ (environment variables; connection strings).'
  control_functions: [preventive]
  cost: low
- id: appservice-app-settings-keyvault
  name: Key Vault References for App Settings
  description: 'Store connection strings and secrets in Key Vault and reference them from app settings with Key Vault references. Rotate secrets and remove plaintext values from configuration and deployment templates. Quelle: MCSB v2 IM-8.'
  control_functions: [preventive]
  cost: low
- id: appservice-diagnostic-logging
  name: App Service HTTP and Application Logging
  description: 'Enable HTTP logs, application logs, and audit logs for App Service and send them to Log Analytics. Detection: alert on bursts of requests to internal or metadata addresses in application logs and on SCM access events. Quelle: MCSB v2 LT-3.'
  control_functions: [detective]
  cost: low
- id: appservice-disable-scm-public
  name: Disable Public SCM and Basic Publishing Credentials
  description: 'Disable basic authentication for FTP and SCM publishing (basicPublishingCredentialsPolicies), restrict the scm site with access restrictions or a private endpoint, and rotate publish profiles after any exposure. Use Entra ID deployment identities instead. Quelle: MCSB v2 NS-2, IM-4.'
  control_functions: [preventive]
  cost: low
- id: appservice-imds-egress-control
  name: SSRF Defense and Metadata Endpoint Blocking
  description: 'Validate and allowlist outbound destinations in application code (scheme, host, resolved IP). Block 169.254.169.254 and other metadata addresses at the app level and through VNet integration with egress firewall rules. The Metadata: true header required by IMDS is not a defense, because SSRF that can set headers can add it. Quelle: MCSB v2 IM-3, NS-2.'
  control_functions: [preventive]
  cost: medium
- id: appservice-managed-identity-least-privilege
  name: Per-Application Managed Identity with Scoped RBAC
  description: 'Use a dedicated user-assigned managed identity per application and assign RBAC roles at resource scope (for example, Key Vault Secrets User on one vault). Never assign Owner or Contributor at subscription scope to application identities. Quelle: MCSB v2 IM-3, PA-7.'
  control_functions: [preventive]
  cost: low
- id: appservice-rce-sast
  name: Secure SDLC for App Service Workloads
  description: 'Run SAST and dependency scanning in CI (Microsoft Defender for DevOps or equivalent), enforce input validation and parameterized queries, avoid dynamic code evaluation, and deploy only signed artifacts through deployment slots with approval gates. Quelle: MCSB v2 PV-6.'
  control_functions: [preventive]
  cost: medium
- id: appservice-secure-runtime
  name: App Service Runtime Hardening
  description: 'Enforce HTTPS only, minimum TLS 1.2, disable remote debugging, keep the runtime stack on a supported version, and place a WAF (Azure Front Door or Application Gateway) in front of the app. Follow CIS Azure Foundations App Service recommendations. Quelle: MCSB v2 DP-3, PV-3.'
  control_functions: [preventive]
  cost: low
- id: appservice-waf
  name: Web Application Firewall in Front of App Service
  description: 'Place Azure Front Door or Application Gateway with WAF in front of the app, use managed rule sets in prevention mode, and allow inbound traffic to the app only through the WAF (access restrictions). Quelle: MCSB v2 NS-2.'
  control_functions: [preventive]
  cost: medium
- id: arc-full-disk-encryption
  name: Volumeverschlüsselung auf Arc-Servern
  description: 'Vollständige Datenträgerverschlüsselung (BitLocker oder dm-crypt) auf dem Betriebssystem-Volume, damit der Schlüssel der Managed Identity nicht offline ausgelesen werden kann. Quelle: CAF Governance, security, and compliance baseline for Azure Arc-enabled servers („full disk encryption“).'
  control_functions: [preventive]
  cost: low
- id: arc-least-privilege-roles
  name: Least-Privilege-Rollen für Arc-Server
  description: 'Keine Contributor- oder Owner-Rolle für Arc-Serverzugriff. Stattdessen die Onboarding-Rolle für Registrierung und die Connected-Machine-Resource-Administrator-Rolle für Verwaltung vergeben. Quelle: CAF Identity and access management for Azure Arc-enabled servers („Apply role-based access control“).'
  control_functions: [preventive]
  cost: low
- id: arc-onboarding-certificate-sp
  name: Zertifikatsbasierte Onboarding-Service-Principal
  description: 'Onboarding mit einer Service Principal mit Zertifikat, auf die Resource Group beschränkt und mit kurzlebigen oder keinen Client-Secrets. Quelle: CAF Identity and access management for Azure Arc-enabled servers („Deploy service principals with certificates“).'
  control_functions: [preventive]
  cost: low
- id: arc-restrict-himds-group
  name: Arc-Agent-Gruppen auf wenige Administratoren beschränken
  description: 'Mitgliedschaft in der Gruppe „Hybrid Agent Extension Applications“ (Windows) bzw. himds (Linux) und in den lokalen Administratoren auf das nötige Minimum begrenzen. Quelle: CAF Identity and access management for Azure Arc-enabled servers („Control privileged user roles on Azure Arc-enabled servers“).'
  control_functions: [preventive]
  cost: low
- id: asr-customer-managed-keys
  name: Kundenverwaltete Schlüssel für replizierte Disks
  description: 'Replizierte Disks mit Customer-Managed-Keys (Key Vault) verschlüsseln, wo Compliance es verlangt. Quelle: Security-Baseline Site Recovery (DP-5); Replicate machines with CMK-enabled disks.'
  control_functions: [preventive]
  cost: low
- id: asr-least-privilege-roles
  name: Site-Recovery-Rollen nach dem Least-Privilege-Prinzip
  description: 'Site Recovery Operator, Contributor und Reader nach Aufgabe vergeben, keine Contributor-Rolle auf Subscription-Ebene. Quelle: Site-Recovery-RBAC („Recommended built-in roles“).'
  control_functions: [preventive]
  cost: low
- id: asr-private-replication
  name: Replikation über Private Endpoints
  description: 'Site-Recovery-Replikation über Private Endpoints führen, statt über öffentliche Endpunkte. Quelle: Security-Baseline Site Recovery (NS-2: Private Link); Azure-to-Azure-Networking.'
  control_functions: [preventive]
  cost: low
- id: avd-appgroup-preferred-type
  name: RemoteApp as Preferred Application Group Type Where Possible
  description: 'Set the preferred application group type to RemoteApp where users need only specific applications, and remove the automatically registered desktop group when it is not needed. Verification: Confirm each workspace registers only the application groups that are needed, and no desktop-type group is assigned to broad groups without a documented reason.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Deploy Azure Virtual Desktop: preferred application group type and default desktop application group.'
  control_functions: [preventive]
  cost: low
- id: avd-appgroup-role-review
  name: Application Group Roles Restricted and Reviewed
  description: 'Restrict Owner, User Access Administrator and Desktop Virtualization Contributor on application groups to named administrators, and review assigned users and groups regularly. Verification: Export role assignments and application group assignments; no unexpected Owner or User Access Administrator entries, and assigned groups match the documented access model.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Deploy Azure Virtual Desktop, Prerequisites; Built-in Azure RBAC roles for AVD.'
  control_functions: [preventive, detective]
  cost: low
- id: avd-conditional-access-mfa
  name: Conditional Access With MFA for Azure Virtual Desktop
  description: 'Require Entra MFA through a Conditional Access policy for the Azure Virtual Desktop and Windows Cloud Login apps, and review MFA policies for Entra-joined session hosts. Verification: Check the Conditional Access policy targeting the Azure Virtual Desktop and Windows Cloud Login apps: grant control requires MFA and the policy is enabled.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Enforce Microsoft Entra MFA for AVD using Conditional Access; Microsoft Entra joined session hosts.'
  control_functions: [preventive]
  cost: low
- id: avd-domain-join-delegation
  name: Domain Join Account With Only the Required OU Permissions
  description: 'Use a dedicated domain join account and delegate only the permissions listed for computer objects in the session host OU, and apply the computer account re-use policy where the account is not the creator. Verification: Review the effective permissions of the join account on the session host OU; no Full Control, no rights on other OUs, and the account is used only for joins.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Deploy Azure Virtual Desktop, Prerequisites: AD DS permissions and KB5020276 computer account re-use.'
  control_functions: [preventive]
  cost: medium
- id: avd-fslogix-av-exclusions-scoped
  name: Antivirus Exclusions Limited to Profile Containers
  description: 'Exclude only the FSLogix profile container files and folders from real-time scanning, and scan profile containers on mount with a scheduled or on-access scan. Verification: Compare the antivirus exclusion list with the FSLogix guidance: only the profile container paths and extensions are excluded, and no exclusion covers other user folders.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: FSLogix prerequisites: configure antivirus file and folder exclusions; Security recommendations for AVD: endpoint protection.'
  control_functions: [preventive, detective]
  cost: medium
- id: avd-hostpool-diagnostics
  name: Host Pool Diagnostic Settings Enabled
  description: 'Enable diagnostic settings on the host pool and send logs to a Log Analytics workspace, so that host pool changes and session activity are retained. Verification: Confirm a diagnostic setting exists for the host pool with a Log Analytics destination and that the workspace receives host pool entries.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Deploy Azure Virtual Desktop, Management tab: enable diagnostic settings.'
  control_functions: [detective]
  cost: low
- id: avd-hostpool-mi-secret-scope
  name: Host Pool Identity Limited to the Required Secrets
  description: 'Grant the host pool managed identity Key Vault Secrets User on the two secrets for the local administrator and the domain join account only, not on the whole vault. Verification: Inspect the role assignment of the host pool managed identity on the Key Vault: scope must be the individual secrets, and no other secrets are readable.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Deploy Azure Virtual Desktop, Prerequisites: Key Vault RBAC for the host pool managed identity.'
  control_functions: [preventive]
  cost: low
- id: avd-hostpool-token-role-review
  name: Registration Token Access Limited to Named Administrators
  description: 'Limit roles that can retrieve the host pool registration token to named administrators, use Host Pool Reader or Session Host Operator for other staff, and rotate the token after session host deployments. Verification: List role assignments containing hostpools/retrieveRegistrationToken on the host pool and its parent scopes; only named deployment administrators are listed.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Built-in Azure RBAC roles for AVD: role definitions with hostpools/retrieveRegistrationToken.'
  control_functions: [preventive, detective]
  cost: low
- id: avd-scaling-plan-max-sessions
  name: Max Session Limit Configured for Each Scaled Host Pool
  description: 'Set a custom MaxSessionLimit for every pooled host pool that uses autoscale, sized to the session host capacity, and review it when the session host SKU changes. Verification: Confirm the host pool''s max session limit is not the default value and matches the session host capacity used in the scaling plan.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Create and assign an autoscale scaling plan for AVD, Prerequisites: MaxSessionLimit.'
  control_functions: [preventive]
  cost: low
- id: avd-scaling-plan-scope
  name: Scaling Plan Roles Limited to the Required Scope
  description: 'Assign the Azure Virtual Desktop service principal or the host pool managed identity only the roles the scaling plan needs, and limit the assignable subscriptions to those that contain the scaled host pools. Verification: Check the role assignments of the service principal and of the host pool managed identity for scope and role names, and confirm only the subscriptions with scaled host pools are assignable.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Create and assign an autoscale scaling plan for AVD: assign roles at subscription scope; service principal permissions.'
  control_functions: [preventive]
  cost: medium
- id: avd-sh-edr
  name: Endpoint Protection and EDR on Session Hosts
  description: 'Enable endpoint protection on all session hosts and onboard them to an EDR product, such as Microsoft Defender for Endpoint, with exclusions limited to required paths. Verification: Confirm each session host is onboarded to the EDR product and reports health; check the AV exclusion list against the FSLogix guidance.. Feature: supported=True, enabled by default=True, responsibility=customer. Quelle: Security recommendations for AVD: enable endpoint protection and install an EDR product.'
  control_functions: [preventive, detective]
  cost: medium
- id: avd-sh-egress-control
  name: Session Host Egress Limited by Firewall, NVA or Proxy
  description: 'Route session host outbound traffic through Azure Firewall, a network virtual appliance or a proxy, and allow only the required AVD endpoints and business destinations. Verification: Check the subnet route table and firewall rules: outbound internet traffic from session host subnets goes through the firewall and only required FQDNs are allowed.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Security recommendations for AVD: limit internet traffic with Azure Firewall, NVAs or proxies; Security and governance (CAF): networking.'
  control_functions: [preventive]
  cost: medium
- id: avd-sh-idle-lock
  name: Idle Timeout and Screen Lock for Sessions
  description: 'Configure maximum inactive time, disconnect and log-off policies, and screen lock for idle sessions through Group Policy or Intune. Verification: Check the applied session timeout and idle lock settings on a session host with gpresult or the Intune policy report.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Security recommendations for AVD: establish maximum inactive time and disconnection policies; set up screen locks for idle sessions.'
  control_functions: [preventive]
  cost: low
- id: avd-sh-jit-no-direct-rdp
  name: Just-in-Time Access Instead of Direct RDP
  description: 'Administer session hosts through just-in-time access and the AVD reverse connect path, and remove permanent RDP access from session hosts. Verification: Confirm no inbound RDP rule allows broad sources on session host NSGs, and that administrative access is granted only through a time-limited just-in-time request.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Security and governance (CAF) for AVD: just-in-time access; avoid direct RDP.'
  control_functions: [preventive]
  cost: medium
- id: avd-sh-laps-rotation
  name: Local Administrator Passwords Rotated by LAPS
  description: 'Use Microsoft LAPS on session hosts so that local administrator passwords are unique per machine and rotated automatically. Verification: On a session host, confirm the LAPS password attributes are populated and the policy''s rotation interval is set.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Identity and access management recommendations for AVD: secure local admin accounts (LAPS).'
  control_functions: [preventive]
  cost: low
- id: avd-sh-no-user-admin
  name: No Local Administrator Rights for Users
  description: 'Do not add users to the local Administrators group on session hosts. Deliver software through configuration management such as Intune. Verification: Review the local Administrators group on a sample of session hosts; only approved administrator groups are members.. Feature: supported=True, enabled by default=True, responsibility=customer. Quelle: Security recommendations for AVD: establish tiered admin access.'
  control_functions: [preventive]
  cost: low
- id: avd-sh-patch-image
  name: Monthly Patching of Session Host Base Images
  description: 'Patch the base image every month and redeploy session hosts from the patched image, and track vulnerabilities on session hosts with a vulnerability assessment. Verification: Compare the image build date and patch level with the current monthly release; confirm the vulnerability assessment reports no critical findings on session hosts.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Security recommendations for AVD: patch base images monthly; threat and vulnerability management.'
  control_functions: [preventive, detective]
  cost: medium
- id: avd-workspace-role-review
  name: Workspace Role Assignments Restricted and Reviewed
  description: 'Assign Desktop Virtualization Contributor on the workspace only to named administrators and review assignments above the workspace scope. Verification: List the role assignments on the workspace and its parent scopes; no broad Desktop Virtualization Contributor assignments for users or groups that do not administer AVD.. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: Built-in Azure RBAC roles for Azure Virtual Desktop.'
  control_functions: [preventive, detective]
  cost: low
- id: azure-files-backup-soft-delete
  name: Azure Files Backup and Soft Delete
  description: 'Protect file shares with Azure Backup in a Recovery Services vault with soft delete and a retention lock. Restrict backup deletion to a separate administrative role and require MFA for backup deletion. Quelle: MCSB v2 BR-1, BR-2.'
  control_functions: [recovery]
  cost: medium
- id: azure-files-diagnostic-monitoring
  name: Azure Files Diagnostic Logging and Alerts
  description: 'Send StorageFileLogs and storage metrics to Log Analytics. Detection: alert on ListKeys/RegenerateKey operations, on SAS generation outside the approved pipeline identity, and on share access by principals not in the expected group. Query example: StorageFileLogs | where OperationName has_any ("ListKeys","RegenerateKey"). Quelle: MCSB v2 LT-3, DP-2.'
  control_functions: [detective]
  cost: low
- id: azure-files-disable-shared-key
  name: Disable Shared Key Access on Storage Accounts
  description: 'Set allowSharedKeyAccess to false on storage accounts hosting Azure Files and authenticate with Entra ID (identity-based SMB access) instead. Removes account keys as a bypass for RBAC and NTFS ACLs. Aligns with CIS Azure Foundations storage hardening. Quelle: MCSB v2 IM-8.'
  control_functions: [preventive]
  cost: low
- id: azure-files-identity-rbac-with-ntfs
  name: Least-Privilege RBAC with NTFS ACLs
  description: 'Grant only the Storage File Data SMB roles needed at share scope, avoid Elevated Contributor for broad groups, and enforce directory-level NTFS ACLs for the actual access model. Never grant share roles to Everyone or Authenticated Users. Review role assignments quarterly. Quelle: MCSB v2 IM-7, PA-7.'
  control_functions: [preventive]
  cost: low
- id: azure-files-private-endpoint
  name: Private Endpoint and Public Access Disabled
  description: 'Expose the file service only through a private endpoint, set publicNetworkAccess to Disabled, and set the storage firewall default action to Deny. Resolve privatelink DNS only inside approved networks. Quelle: MCSB v2 NS-2, NS-9.'
  control_functions: [preventive]
  cost: medium
- id: azure-files-short-lived-sas
  name: Short-Lived Scoped SAS Tokens
  description: 'Issue user-delegation SAS tokens (Entra ID backed) with minimal permissions, short expiry, and IP restrictions. Rotate account keys on a schedule and after any suspected exposure. Keep secrets in Key Vault, never in code or tickets. Quelle: MCSB v2 IM-8.'
  control_functions: [preventive]
  cost: low
- id: azure-files-smb-encryption
  name: SMB 3.x Encryption and Minimum Protocol Version
  description: 'Require SMB 3.1.1 with encryption in transit for Azure Files shares, and disable SMB 2.x and unencrypted access. Verify client support before enforcement. Quelle: MCSB v2 DP-3.'
  control_functions: [preventive]
  cost: low
- id: b2c-enable-mfa
  name: MFA in B2C-Benutzerflows aktivieren
  description: 'Microsoft-Entra-MFA in Sign-up- und Sign-in-Flows einbinden, sensible Anwendungen zusätzlich absichern. Quelle: Enable-multifactor-authentication-in-Azure-AD-B2C.'
  control_functions: [preventive]
  cost: low
- id: b2c-smart-lockout
  name: Passwortkomplexität und Smart Lockout in B2C
  description: 'Passwortkomplexität konfigurieren und Smart Lockout beibehalten, Passwort-Reset bei Verdacht erzwingen. Quelle: Azure-AD-B2C-Technical-Overview (Password complexity, Smart account lockout, Force password reset).'
  control_functions: [preventive]
  cost: low
- id: b2c-user-risk-policy
  name: Conditional-Access-Richtlinie auf Benutzerrisiko in B2C
  description: 'Richtlinie für mittleres und hohes Benutzerrisiko mit MFA und Passwortänderung. Quelle: Conditional-Access-User-Flow (Template 2). Hinweis: B2C-Tenants brauchen die passende Lizenz für Identity Protection.'
  control_functions: [preventive, detective]
  cost: low
- id: bastion-entra-id-auth
  name: Entra-ID-Authentifizierung für Bastion
  description: 'Entra-ID-Anmeldung für SSH und RDP aktivieren, damit MFA und Conditional Access gelten. Quelle: Design-secure-hub-spoke-network (Enable Microsoft Entra ID authentication); Secure-Azure-Bastion.'
  control_functions: [preventive]
  cost: low
- id: bastion-no-public-ip
  name: Öffentliche IPs an VMs entfernen
  description: 'Öffentliche IP-Adressen von VMs entfernen, die nur über Bastion erreichbar sein sollen. Quelle: Developer-and-admin-access-to-Azure-VMs (Use Bastion or P2S VPN instead of public IPs).'
  control_functions: [preventive]
  cost: low
- id: bastion-nsg-required-rules
  name: Bastion-NSG-Regeln exakt umsetzen
  description: 'Die erforderlichen Ein- und Ausgangsregeln für AzureBastionSubnet setzen, Zielsubnetze nur von AzureBastionSubnet auf 3389 und 22 zulassen. Quelle: Configure-NSG-rules-Azure-Bastion.'
  control_functions: [preventive]
  cost: low
- id: bkp-immutable-vault-lock
  name: Unveränderbaren Backup-Vault sperren
  description: 'Immutability aktivieren und sperren, damit Wiederherstellungspunkte vor Ablauf der Aufbewahrung nicht gelöscht werden können. Quelle: Azure-Backup-Security-Best-Practices (Pillar 3: Lock immutability), Backup-Security-Overview (Security levels).'
  control_functions: [preventive]
  cost: low
- id: bkp-mua-resource-guard
  name: Multi-User Authorization mit Resource Guard
  description: 'MUA für den Vault aktivieren, Resource Guard in einem separaten Subscription- oder Tenant-Bereich anlegen, damit kein Einzelner alle Berechtigungen hat. Quelle: Azure-Backup-Security-Best-Practices (MUA, Resource Guard in separater Subscription/Tenant).'
  control_functions: [preventive]
  cost: low
- id: bkp-private-endpoint
  name: Private Endpoint und Deaktivierung des öffentlichen Zugangs für Backup
  description: 'Private Endpoints für den Recovery Services Vault einrichten und den öffentlichen Netzwerkzugang deaktivieren. Quelle: Azure-Backup-Security-Best-Practices (Policies: private link, disable public network access), Security-overview (Private Endpoints for Azure Backup).'
  control_functions: [preventive]
  cost: low
- id: bkp-soft-delete-always-on
  name: Soft Delete für Backup-Vaults dauerhaft aktivieren
  description: 'Soft Delete aktivieren und in den Always-on-Zustand setzen, Aufbewahrung über die Policy-Aufbewahrung hinaus setzen. Quelle: Azure-Backup-Security-Best-Practices (Soft delete retention > 35 Tage), Enhanced-soft-delete-Release-Notes.'
  control_functions: [recovery]
  cost: low
- id: ddos-monitoring-telemetry
  name: DDoS-Telemetrie und Angriffsprotokolle an Azure Monitor
  description: 'Diagnoseeinstellungen für DDoS-Metriken und Angriffsprotokolle aktivieren, Alarme einrichten. Quelle: DDoS-protection-for-Azure-networks-cross-cloud (Prerequisites 5).'
  control_functions: [detective]
  cost: low
- id: ddos-protect-every-public-ip
  name: DDoS-Schutz für jede unterstützte öffentliche IP
  description: 'DDoS Network Protection auf den VNets oder DDoS IP Protection auf jeder öffentlichen IP aktivieren. Quelle: Secure-Azure-DDoS-Protection (Network security 2).'
  control_functions: [preventive]
  cost: low
- id: ddos-validate-supported-deployment
  name: Unterstützte Bereitstellungsmodelle vor dem Schutz prüfen
  description: 'Vor der Aktivierung prüfen, ob die Ressourcen unterstützt werden, und Ausnahmen dokumentieren. Quelle: About-Azure-DDoS-Protection-Tier-Comparison (Limitations).'
  control_functions: [preventive]
  cost: low
- id: dds-disable-ntlm-password-sync
  name: NTLM-Passwort-Synchronisation in Domain Services deaktivieren
  description: '„SyncNtlmPasswords“ auf Disabled setzen, sofern keine Anwendung NTLM oder LDAP-Simple-Bind benötigt. Danach eine vollständige Passwort-Hash-Synchronisation in Entra Connect ausführen, damit alte Hashes entfernt werden. Quelle: Entra-Domain-Services „Harden a managed domain“ (Important: full password hash sync nach dem Deaktivieren).'
  control_functions: [preventive]
  cost: low
- id: dds-disable-weak-protocols
  name: Schwache Protokolle in Domain Services deaktivieren
  description: 'NtlmV1, TlsV1 und KerberosRc4Encryption auf Disabled setzen und KerberosArmoring aktivieren. Quelle: Entra-Domain-Services „Harden a managed domain“ (Security settings 5.1–5.5).'
  control_functions: [preventive]
  cost: low
- id: dds-ldap-signing-channel-binding
  name: LDAP-Signing und Channel Binding in Domain Services
  description: 'LDAP-Signing und LDAP-Channel-Binding aktivieren. Quelle: Entra-Domain-Services „Harden a managed domain“ (LDAP Signing, LDAP Channel Binding); LDAP-Channel-Binding-Übersicht.'
  control_functions: [preventive]
  cost: low
- id: defender-containers-plan
  name: Defender-for-Containers-Plan aktivieren
  description: 'Den Plan Defender for Containers aktivieren, mit Registry-Zugriff und Bedrohungsschutz auf dem Kontrollpunkt. Quelle: Enable-Defender-for-Containers (Enable the Defender for Containers plan).'
  control_functions: [detective]
  cost: low
- id: defender-enable-on-all-subscriptions
  name: Defender for Cloud auf allen Subscriptions aktivieren
  description: 'Foundational CSPM auf allen Subscriptions aktivieren und Multicloud-Verbindungen einbinden. Quelle: What-is-Microsoft-Defender-for-Cloud (CSPM, multicloud coverage); Planning-and-operations-guide (Monitor for new or changed resources).'
  control_functions: [detective]
  cost: low
- id: defender-review-recommendations
  name: Empfehlungen nach Schweregrad bearbeiten
  description: 'Empfehlungen nach Risiko priorisieren, Verantwortliche festlegen und Fortschritt im Secure Score verfolgen. Quelle: Security-policies-in-Defender-for-Cloud (Security recommendations); Planning-and-operations-guide.'
  control_functions: [detective, preventive]
  cost: low
- id: dhsm-change-default-credentials
  name: Standardpasswörter sofort ändern
  description: 'Nach der Bereitstellung das Standardpasswort des Mandanten-Administrators ändern und sicher verwahren. Quelle: Secure-Dedicated-HSM (Identity and access management 1).'
  control_functions: [preventive]
  cost: low
- id: dhsm-ha-pairs-backup
  name: HSM-Paare und Schlüsselsicherung
  description: 'Mindestens zwei HSM pro Region als HA-Paar betreiben, Schlüssel regelmäßig sichern und Wiederherstellung testen. Quelle: Secure-Dedicated-HSM (Backup and recovery 1–4).'
  control_functions: [recovery]
  cost: low
- id: dhsm-operational-procedures
  name: Betriebsabläufe gegen Zeroization absichern
  description: 'Anmeldeverfahren und Rollen so festlegen, dass Fehlversuche die Rollen nicht zerstören. Quelle: Secure-Dedicated-HSM (Identity and access management 6, Failed sign-ins).'
  control_functions: [preventive]
  cost: low
- id: dns-review-zone-links
  name: Private-DNS-Zonen-Verknüpfungen prüfen
  description: 'VNet-Verknüpfungen und Auto-Registrierung je Zone regelmäßig prüfen und nur für benötigte VNets aktivieren. Quelle: DNS-Security-Design-Guide (Private DNS zone concepts: VNet linking, Auto-registration).'
  control_functions: [preventive]
  cost: low
- id: dns-security-policy
  name: DNS-Sicherheitsrichtlinie (Threat Intelligence) aktivieren
  description: 'DNS security policy aktivieren, damit Auflösungen bekannter bösartiger Domains blockiert werden. Quelle: DNS-Security-Design-Guide (DNS security policy).'
  control_functions: [preventive]
  cost: low
- id: dns-validating-resolver
  name: Validierenden DNS-Resolver für DNSSEC einsetzen
  description: 'Wo DNSSEC-Validierung verlangt wird, einen Resolver mit Validierung einsetzen oder die Anwendung die Identität selbst prüfen lassen. Quelle: DNS-Security-Design-Guide (DNSSEC limitations).'
  control_functions: [preventive]
  cost: low
- id: entra-block-legacy-auth
  name: Block Legacy Authentication and Device Code Flow
  description: 'Block legacy authentication protocols (IMAP, POP, SMTP AUTH, basic-auth EWS) with a Conditional Access policy for all users. Block the device code authentication flow unless a documented scenario requires it. Quelle: MCSB v2 IM-6, IM-7.'
  control_functions: [preventive]
  cost: low
- id: entra-break-glass-accounts
  name: Monitored Emergency Access Accounts
  description: 'Maintain two cloud-only emergency access accounts with phishing-resistant credentials, excluded from Conditional Access only where required. Detection: alert on any sign-in by these accounts, with an out-of-band notification to the security team. Quelle: MCSB v2 PA-5.'
  control_functions: [preventive, detective]
  cost: low
- id: entra-ca-gap-review
  name: Conditional Access Baseline and Exclusion Review
  description: 'Maintain a Conditional Access baseline with explicit targeting for all cloud apps and all users. Limit exclusions to two monitored break-glass accounts, keep named locations narrow, and require compliant or hybrid-joined devices for admin portals. Review policy changes through Entra audit logs. Quelle: MCSB v2 IM-7.'
  control_functions: [preventive]
  cost: low
- id: entra-customer-lockbox
  name: Customer Lockbox for Azure
  description: 'Enable Customer Lockbox so Microsoft engineers need explicit approval before accessing customer data for support. Include the approval workflow in the provider access process. Quelle: MCSB v2 PA-8.'
  control_functions: [preventive]
  cost: medium
- id: entra-password-protection
  name: Entra Password Protection and Smart Lockout
  description: 'Enable Microsoft Entra Password Protection with a global and custom banned-password list and smart lockout thresholds. Detection: alert on sign-in failure bursts across many accounts from one source (password spray pattern) in Entra sign-in logs. Quelle: MCSB v2 IM-6.'
  control_functions: [preventive, detective]
  cost: low
- id: entra-phishing-resistant-mfa
  name: Phishing-Resistant MFA for Privileged and Remote Access
  description: 'Require phishing-resistant authentication (FIDO2 security keys, Windows Hello for Business, or certificate-based authentication) for administrator roles and all remote access. Authentication strengths in Conditional Access enforce this. Push-based MFA does not stop adversary-in-the-middle phishing. Quelle: MCSB v2 IM-6.'
  control_functions: [preventive]
  cost: medium
- id: entra-pim-just-in-time
  name: Privileged Identity Management with Approval and Access Reviews
  description: 'Make all Entra and Azure privileged roles eligible-only through Privileged Identity Management, with time-bound activation, justification, and approval. Run access reviews for privileged roles at least quarterly. Quelle: MCSB v2 PA-2, PA-4, PA-6.'
  control_functions: [preventive]
  cost: low
- id: entra-risk-detection
  name: Identity Protection Risk Policies and AiTM Detection
  description: 'Enable Identity Protection sign-in and user risk policies. Sentinel analytics: sign-ins with reused session tokens, unfamiliar sign-in properties, impossible travel, and inbox rule creation within minutes of a risky sign-in (correlate SigninLogs with OfficeActivity). Quelle: MCSB v2 LT-2.'
  control_functions: [detective]
  cost: medium
- id: entra-sp-credential-hygiene
  name: Workload Identity Credential Hygiene
  description: 'Replace client secrets with managed identities or federated workload credentials where supported. For remaining secrets, cap lifetime at 6 to 12 months and store them in Key Vault. Restrict user consent to verified publishers and route app requests through the admin consent workflow. Quelle: MCSB v2 IM-3, IM-8.'
  control_functions: [preventive]
  cost: low
- id: entra-sp-least-privilege-monitor
  name: Service Principal Privilege and Credential Monitoring
  description: 'Review high-privilege Microsoft Graph application permissions and app role assignments quarterly. Detection: alert on AuditLogs events ''Add service principal credentials'' and ''Update application - Certificates and secrets management'', and on new grants of Directory.ReadWrite.All or RoleManagement.ReadWrite.Directory. Quelle: MCSB v2 IM-3, LT-2.'
  control_functions: [detective]
  cost: low
- id: entra-token-protection-cae
  name: Token Protection and Continuous Access Evaluation
  description: 'Enable Continuous Access Evaluation for supported workloads so revoked or risky sessions end quickly. Use token protection (sender-constrained tokens) in Conditional Access for supported clients so stolen cookies or refresh tokens cannot be replayed from another device. Quelle: MCSB v2 IM-6, IM-7.'
  control_functions: [preventive]
  cost: low
- id: entra-user-consent-restriction
  name: Restricted User Consent and Admin Consent Workflow
  description: 'Disable end-user consent for applications, or limit it to verified publishers with low-risk permissions, and enable the admin consent request workflow. Review enterprise applications with new consent grants weekly. Quelle: MCSB v2 IM-5.'
  control_functions: [preventive]
  cost: low
- id: er-ipsec-over-er
  name: IPsec über ExpressRoute private peering
  description: 'Eine IPsec-VPN-Verbindung über das private Peering einrichten, damit der Verkehr verschlüsselt ist. Quelle: VPN-over-ExpressRoute-for-Virtual-WAN; About-encryption-for-ExpressRoute (IPsec).'
  control_functions: [preventive]
  cost: low
- id: er-md5-bgp
  name: MD5-Authentifizierung für BGP-Sitzungen
  description: 'Für das private oder Microsoft-Peering einen MD5-Hash für BGP-Sitzungen konfigurieren. Quelle: Secure-ExpressRoute-deployment (Data protection 2).'
  control_functions: [preventive]
  cost: low
- id: er-rbac-circuits
  name: RBAC für ExpressRoute-Ressourcen
  description: 'Rechte auf Circuits und Gateways nach Rolle vergeben, Verwaltungsrechte nur an Netzwerkadministratoren. Quelle: Architecture-best-practices-ExpressRoute (Security: RBAC).'
  control_functions: [preventive]
  cost: low
- id: esan-disable-public-access
  name: Öffentlichen Netzwerkzugang für Elastic SAN deaktivieren
  description: 'Bei ausschließlicher Nutzung von Private Endpoints den öffentlichen Zugang deaktivieren. Quelle: Elastic-SAN-Networking (Public network access).'
  control_functions: [preventive]
  cost: low
- id: esan-private-endpoint-network-policies
  name: Network Policies für Elastic-SAN-Private-Endpoints
  description: 'Network Policies für das Subnetz aktivieren, damit NSG und UDR für den Endpoint wirken. Quelle: Configure-private-endpoints-for-Azure-Elastic-SAN (Optional: network policies).'
  control_functions: [preventive]
  cost: low
- id: esan-snapshot-recovery
  name: Snapshots als Wiederherstellungsweg für Elastic SAN
  description: 'Da Soft Delete nicht unterstützt wird, regelmäßig Snapshots anlegen und Wiederherstellung testen. Verschlüsselung in Transit ist nicht verfügbar, daher Anwendungsebene prüfen. Quelle: What-is-Azure-Elastic-SAN (Support for Storage features).'
  control_functions: [recovery]
  cost: low
- id: flow-private-connectivity
  name: Private Connectivity for Data Flows
  description: 'Reach each service over a Private Endpoint and resolve its name through a private DNS zone, and disable the public network path where the service supports it. Verify that clients validate the service certificate. Verification: check that the service''s publicNetworkAccess is Disabled, that a private endpoint exists, and that the DNS zone resolves the service name to a private address. Quelle: Learn: Azure Private Link and private endpoints; MCSB v2 NS-2.'
  control_functions: [preventive]
  cost: medium
- id: fw-diagnostic-logs
  name: Diagnoseprotokolle der Azure Firewall weiterleiten
  description: 'Alle Firewall-Logkategorien an Log Analytics senden und überwachen. Quelle: Zero-Trust-Recommendations-Azure-Firewall (Diagnostic logging is enabled).'
  control_functions: [detective]
  cost: low
- id: fw-idps-deny
  name: IDPS im Modus Alert and deny
  description: 'IDPS (Premium) im Modus Alert and deny betreiben und Signaturaktionen nach Tuning anpassen. Quelle: Zero-Trust-Recommendations-Azure-Firewall (IDPS inspection enabled in deny mode).'
  control_functions: [preventive]
  cost: low
- id: fw-threat-intel-deny
  name: Threat Intelligence im Modus Alert and deny
  description: 'Threat Intelligence auf Standard oder Premium im Modus Alert and deny betreiben. Quelle: Architecture-best-practices-Azure-Firewall (Security: threat intelligence).'
  control_functions: [preventive]
  cost: low
- id: fw-tls-inspection
  name: TLS-Inspektion für ausgehenden Verkehr
  description: 'TLS-Inspektion mit Zwischen-CA-Zertifikat in Key Vault aktivieren, Zertifikate und Vertrauen im Client verwalten. Quelle: Zero-Trust-Recommendations-Azure-Firewall (TLS inspection); Azure-Firewall-Design-Guide (TLS inspection Premium).'
  control_functions: [preventive]
  cost: low
- id: fwm-dns-proxy-clients
  name: DNS-Proxy und Client-DNS konsistent konfigurieren
  description: 'Clients so konfigurieren, dass sie die Firewall als DNS-Server nutzen, wenn FQDN-Regeln gelten, und mehrere Upstream-DNS-Server einrichten. Quelle: Azure-Firewall-Design-Guide (cross-cloud: Caution zu DNS-Proxy; Upstream-Ausfall).'
  control_functions: [preventive]
  cost: low
- id: fwm-policy-hierarchy
  name: Policy-Hierarchie mit Parent-Regeln und Change-Kontrolle
  description: 'Globale Regeln in der Parent-Policy halten, regionale Ausnahmen in Child-Policies. Änderungen an der Parent-Policy nur mit Review. Quelle: Azure-Firewall-Design-Guide (Policy hierarchy und inheritance); Secure-Azure-Firewall (Centralize policy with Firewall Manager).'
  control_functions: [preventive]
  cost: low
- id: fwm-routing-intent
  name: Routing so setzen, dass privater Verkehr über die Firewall läuft
  description: 'Private Traffic über die Firewall leiten, zusätzliche private IP-Präfixe explizit angeben und Routing Intent aktivieren. Quelle: Tutorial secure virtual hub (Security configuration: Private traffic, Private Traffic Prefixes, Inter-hub).'
  control_functions: [preventive]
  cost: low
- id: hdi-encryption-in-transit
  name: Verschlüsselung der Clusterkommunikation
  description: 'Encryption in transit mit IPsec zwischen den Clusterknoten aktivieren, SSL am Gateway verwenden. Quelle: Security-options-for-Hive-in-HDInsight (Encryption in transit; SSL on the gateway).'
  control_functions: [preventive]
  cost: low
- id: hdi-esp-cluster
  name: Enterprise Security Package für HDInsight
  description: 'Clusterauthentifizierung über Kerberos und Autorisierung über Apache Ranger mit ESP betreiben. Quelle: Security-options-for-Hive-in-HDInsight (ESP: Kerberos and Ranger enabled by default).'
  control_functions: [preventive]
  cost: low
- id: hdi-keytab-protection
  name: Keytab-Dateien schützen und rotieren
  description: 'Keytab-Dateien nur auf dem Berechtigten Host ablegen, Berechtigungen einschränken und Schlüssel regelmäßig erneuern. Quelle: Enterprise-security-general-information (Generate domain user keytabs); HDInsight-FAQ.'
  control_functions: [preventive]
  cost: low
- id: kv-backup
  name: Native Key Vault Backup of Keys and Secrets
  description: 'Back up keys, secrets and certificates with the native backup feature to a location that is protected by its own access controls. Verification: backup run recorded and restore tested for each vault. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 BR-1; learn.microsoft.com/azure/key-vault/general/backup.'
  control_functions: [recovery]
  cost: low
- id: kv-cmk-for-regulated-data
  name: Customer-Managed Keys for Regulated Data Stores
  description: 'For regulated workloads, store the encryption key in Key Vault or Managed HSM and use it as the customer-managed key of the dependent service. Verification: each dependent resource (storage account, disk, SQL) reports a customer-managed key whose key id points to this vault. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 DP-5; learn.microsoft.com/azure/security/fundamentals/encryption-models.'
  control_functions: [preventive]
  cost: medium
- id: kv-conditional-access
  name: Conditional Access for Vault Data Plane Sign-In
  description: 'Apply Microsoft Entra conditional access policies that require compliant devices, trusted locations and risk-based controls for sign-ins that reach the vault. Verification: conditional access policy targets the Key Vault resource or the users with vault roles. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-7; learn.microsoft.com/azure/key-vault/general/security-features#conditional-access.'
  control_functions: [preventive]
  cost: low
- id: kv-defender-plan
  name: Microsoft Defender for Key Vault Enabled
  description: 'Enable Microsoft Defender for Key Vault on the subscription and act on its alerts. Verification: Azure Defender for Key Vault should be enabled. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 LT-1; learn.microsoft.com/azure/defender-for-cloud/defender-for-key-vault-introduction.'
  control_functions: [detective]
  cost: medium
- id: kv-firewall-disable-public-access
  name: Key Vault Firewall Enabled and Public Network Access Disabled
  description: 'Enable the Key Vault firewall and disable public network access. Allow only trusted networks or private endpoints. Verification: Azure Key Vault should have firewall enabled (55615ac9-af46-4a59-874e-391cc3dfb490). Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 NS-2; learn.microsoft.com/azure/key-vault/general/how-to-azure-key-vault-network-security.'
  control_functions: [preventive]
  cost: low
- id: kv-key-autorotation
  name: Key Autorotation Configured
  description: 'Configure autorotation for keys and certificates on a defined schedule, with the rotation timer set to a period shorter than the key lifetime. Verification: autorotation policy present on each key with a rotation interval. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 DP-6; learn.microsoft.com/azure/key-vault/general/autorotation.'
  control_functions: [preventive]
  cost: low
- id: kv-key-expiration-policy
  name: Key Expiration Date Enforced
  description: 'Require an expiration date on all keys through Azure Policy so that no key is valid indefinitely. Verification: Key Vault keys should have an expiration date (152b15f7-8e1f-4c1f-ab71-8c010ba5dbc0). Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 DP-6; learn.microsoft.com/azure/key-vault/keys/about-keys-details.'
  control_functions: [preventive]
  cost: low
- id: kv-least-privilege-rbac
  name: Azure RBAC With Object-Scoped Least-Privilege Roles
  description: 'Use the Azure RBAC permission model and assign data plane roles at the narrowest scope possible. Use JIT eligible assignments via PIM for administrative roles. Verification: Azure Key Vault should use RBAC permission model. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 PA-7; learn.microsoft.com/azure/key-vault/general/rbac-guide.'
  control_functions: [preventive]
  cost: low
- id: kv-managed-identity
  name: Managed Identity for Applications Accessing Key Vault
  description: 'Use a managed identity for each application instead of a service principal secret, so that no credential is stored or rotated by hand. Verification: no service principal client secrets used for vault access in sign-in logs. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-3; learn.microsoft.com/azure/key-vault/general/authentication.'
  control_functions: [preventive]
  cost: low
- id: kv-private-endpoint
  name: Private Endpoint for Key Vault
  description: 'Create a private endpoint so that clients reach the vault only through a private IP in the virtual network. Verification: Azure Key Vaults should use private link. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 NS-2; learn.microsoft.com/azure/key-vault/general/private-link-service.'
  control_functions: [preventive]
  cost: medium
- id: kv-references-not-copies
  name: Key Vault References Instead of Copied Secrets
  description: 'Reference secrets from app settings or pipelines with Key Vault references and pipeline secret variables. Do not copy the secret value into code, templates or configuration. Verification: secret scanning in repositories finds no vault secret values. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 IM-8; learn.microsoft.com/azure/key-vault/secrets/about-secrets.'
  control_functions: [preventive]
  cost: low
- id: kv-resource-logs-to-sentinel
  name: Vault Resource Logs Sent to Workspace and Sentinel
  description: 'Enable resource logs for AuditEvent and send them to a Log Analytics workspace that is connected to Microsoft Sentinel. Detection example: alert on SecretGet or KeyDecrypt by a principal not on the allowlist. Verification: Resource logs in Key Vault should be enabled. Feature: supported=True, enabled by default=False, responsibility=customer. Quelle: MCSB v2 LT-4; learn.microsoft.com/azure/key-vault/general/logging.'
  control_functions: [detective]
  cost: low
- id: kv-soft-delete-purge-protection
  name: Soft Delete and Purge Protection Enabled
  description: 'Enable soft delete and purge protection on the vault. Purge protection cannot be disabled once enabled and blocks permanent deletion during the retention period. Verification: properties.enableSoftDelete and properties.enablePurgeProtection are true on every vault (az keyvault show). Feature: supported=True, enabled by default=True, responsibility=customer. Quelle: MCSB v2 BR-1; learn.microsoft.com/azure/key-vault/general/soft-delete-overview.'
  control_functions: [recovery, preventive]
  cost: low
- id: la-aad-trigger-auth
  name: Microsoft-Entra-Authentifizierung für Request-Trigger
  description: 'Request-Trigger mit Microsoft Entra OAuth absichern oder API Management mit Authentifizierung davorschalten. Quelle: Azure-security-baseline-Logic-Apps (AAD authentication for Logic Apps Request triggers); Secure-Standard-workflows-with-API-Management.'
  control_functions: [preventive]
  cost: low
- id: la-access-control-mode
  name: Zugriffsmodus Ressourcen- oder Workspace-Berechtigungen
  description: 'Zugriffssteuerung auf Ressourcen- oder Workspace-Berechtigungen setzen, Tabellen-RBAC und geschützte Tabellen für sensible Daten nutzen. Quelle: Manage-access-to-Log-Analytics-workspaces; Best-practices-Azure-Monitor-Logs (Grant access based on need).'
  control_functions: [preventive]
  cost: low
- id: la-immutable-export
  name: Daten-Export in unveränderbaren Speicher
  description: 'Logs per Data Export in ein Speicherkonto mit Immutability-Richtlinie exportieren. Quelle: Architecture-best-practices-Log-Analytics (Data export with immutability policies).'
  control_functions: [recovery]
  cost: low
- id: la-keyvault-app-settings
  name: Geheimnisse aus Key Vault über App-Einstellungen
  description: 'Zugangsdaten in Key Vault ablegen und über App-Einstellungen referenzieren, nicht im Workflow. Quelle: Azure-security-baseline-Logic-Apps (IM-8); Best-practices-protecting-secrets.'
  control_functions: [preventive]
  cost: low
- id: la-managed-identity
  name: Verwaltete Identität für Logic Apps
  description: 'Systemzugewiesene oder benutzerzugewiesene Managed Identity aktivieren und nur die nötigen Rechte vergeben. Quelle: Azure-security-baseline-Logic-Apps (Identity management: managed identities); Custom-extension-security (Use managed identities).'
  control_functions: [preventive]
  cost: low
- id: la-private-link
