- id: arc-managed-identity-key-theft
  name: Azure Arc Managed Identity Key Theft
  description: 'Der private Schlüssel der systemzugewiesenen Managed Identity liegt auf der Festplatte des Servers. Wer den Schlüssel stiehlt, kann Tokens anfordern und sich als der Server bei Azure-Ressourcen ausweisen. Quelle: Security-Overview Azure Arc-enabled servers (Zertifikat auf dem Datenträger), CAF Arc-Security-Baseline (Managed Identity: privater Schlüssel auf dem Server). MITRE ATT&CK T1078.004.'
- id: arc-excessive-extension-rights
  name: Azure Arc Extension Deployment for Root Access
  description: 'Benutzer mit Contributor- oder Owner-Rolle auf Arc-Servern können Erweiterungen deployen und damit administrativen Zugriff auf den Server erlangen. Quelle: CAF Identity and access management for Azure Arc-enabled servers („Security risk: Avoid granting broad permissions like Owner or Contributor“). MITRE ATT&CK T1078.004.'
- id: arc-onboarding-client-secret
  name: Azure Arc Onboarding with Long-Lived Client Secret
  description: 'Die Onboarding-Service-Principal wird mit einem Client-Secret statt mit einem Zertifikat authentifiziert. Ein langlebiges oder geteiltes Secret erlaubt es, beliebig viele Server zu registrieren. Quelle: CAF Identity and access management for Azure Arc-enabled servers („Certificate-based authentication (Recommended)“, Secrets kurzlebig halten). MITRE ATT&CK T1078.004.'
- id: dds-ntlm-hash-sync-exposure
  name: Entra Domain Services NTLM Hash Synchronization
  description: 'Mit aktivierter NTLM-Passwort-Synchronisation liegen NTLM-Hashes im Managed Domain. Ein Angreifer mit Domänenzugriff kann diese offline knacken. Quelle: Entra-Domain-Services „Harden a managed domain“ (NTLM Password Synchronization) und „Password hashes“ (Legacy-Hashes nur bei Bedarf). MITRE ATT&CK T1110.002.'
- id: dds-weak-protocols-enabled
  name: Entra Domain Services Weak Protocols Enabled
  description: 'NTLMv1, TLS 1.0 und Kerberos RC4 bleiben aktiv, obwohl sie schwache Kryptografie verwenden. Angreifer können Verbindungen auf diese Protokolle zurückstufen. Quelle: Entra-Domain-Services „Harden a managed domain“ (Security settings: NtlmV1, TlsV1, KerberosRc4Encryption). MITRE ATT&CK T1040.'
- id: dds-ldap-relay
  name: Entra Domain Services LDAP Relay
  description: 'LDAP-Signing und Channel Binding sind nicht erzwungen. Ein über NTLM geführter LDAP-Bind kann auf eine andere Sitzung relayed werden. Quelle: Entra-Domain-Services „Harden a managed domain“ (LDAP Signing, LDAP Channel Binding); LDAP-Channel-Binding-Übersicht (NTLM-Credential-Relay). MITRE ATT&CK T1557.'
- id: acr-anonymous-pull
  name: Container Registry Anonymous Pull
  description: 'Anonymer Pull ist aktiv, obwohl die Registry keine öffentlichen Inhalte hostet. Jeder ohne Anmeldung kann Images aller Repositories lesen. Quelle: Secure-your-ACR-deployment („Keep anonymous pull access disabled unless the registry is intentionally public“). MITRE ATT&CK T1530.'
- id: acr-admin-account-enabled
  name: Container Registry Admin Account Enabled
  description: 'Der Admin-Account der Registry ist aktiv. Er ist ein einziges Konto mit vollen Rechten, und Aktionen sind nicht einer Person zuzuordnen. Quelle: Secure-your-ACR-deployment („Keep the admin account disabled“), Authentication-Übersicht (Admin account). MITRE ATT&CK T1078.001.'
- id: acr-public-network-access
  name: Container Registry Public Network Access
  description: 'Die Registry ist über das öffentliche Internet erreichbar, ohne Private Endpoint und ohne IP-Regeln. Zugangsdaten können von überall genutzt werden. Quelle: Secure-your-ACR-deployment („Network security“: Private Endpoint, Public Access deaktivieren), Policy-Initiative Container Registry („Public network access should be disabled“). MITRE ATT&CK T1190.'
- id: asr-replication-over-public-endpoint
  name: Site Recovery Replication Over Public Endpoint
  description: 'Die Replikation läuft über den öffentlichen Endpunkt, sofern kein Private Endpoint eingerichtet ist. Replizierte Festplatten können auf dem Weg abgefangen werden. Quelle: Security-Baseline Site Recovery (NS-2: „Replicates data … over a public endpoint“), Azure-to-Azure-Networking (Outbound über Service Tags). MITRE ATT&CK T1040.'
- id: asr-over-privileged-operator
  name: Site Recovery Over-Privileged Operators
  description: 'Operatoren erhalten breite Rechte wie Contributor statt der Site-Recovery-Rollen. Ein kompromittiertes Konto kann dann Replikate, Failover und Zielnetze verändern. Quelle: Site-Recovery-RBAC („Recommended built-in roles“: Site Recovery Contributor, Operator, Reader; Least privilege). MITRE ATT&CK T1078.004.'
- id: asr-replica-platform-keys
  name: Site Recovery Replicas With Platform-Managed Keys
  description: 'Replizierte Daten sind nur mit Microsoft-verwalteten Schlüsseln verschlüsselt. Ohne eigene Schlüssel kann die Organisation den Zugriff nicht selbst sperren. Quelle: Security-Baseline Site Recovery (DP-5: Customer-managed keys „Enabled by default: False“). MITRE ATT&CK T1530.'
- id: dns-private-zone-misconfigured-links
  name: Azure DNS Private Zone Misconfigured Links
  description: 'Eine private DNS-Zone ist mit VNets verknüpft, in denen sie nicht gebraucht wird, oder Auto-Registrierung trägt Einträge ein, die Namen anderer Ressourcen überschreiben. Ressourcen im Netz lösen dann Namen auf fremde Ziele auf. Quelle: DNS-Security-Design-Guide (Private DNS zones: VNet-Verknüpfung, Auto-Registrierung), Private-DNS-Import-Export (Merge-Verhalten bestehender Einträge). MITRE ATT&CK T1584.003.'
- id: dns-no-dnssec-validation
  name: Azure DNS Private Resolution Without DNSSEC Validation
  description: 'Rekursive Auflösung innerhalb von Azure-VNets validiert DNSSEC nicht. Gefälschte Antworten werden akzeptiert. Quelle: DNS-Security-Design-Guide (DNSSEC limitations: private Zonen nicht validiert), DNSSEC-Übersicht. MITRE ATT&CK T1557.'
- id: dns-command-and-control-resolution
  name: Azure DNS Resolution of Malicious Domains
  description: 'Workloads lösen Domains auf, die für Command-and-Control oder Malware-Verteilung genutzt werden. Ohne DNS-Schutz wird die Verbindung nicht unterbunden. Quelle: DNS-Security-Design-Guide (DNS security policy: Blockieren bekannter bösartiger Domains über Threat-Intelligence). MITRE ATT&CK T1071.'
- id: sentinel-security-logs-not-ingested
  name: Microsoft Sentinel Security Logs Not Ingested
  description: 'Sicherheitsrelevante Logs werden nicht an Sentinel angebunden, weil keine Datenkonnektoren aktiv sind oder Filter zu viel verwerfen. Angriffe bleiben ohne Erkennung. Quelle: Best-practices-data (Alternative data ingestion: Log-Filterung schränkt Features wie UEBA und Fusion ein), Sentinel-Overview (350+ Datenkonnektoren). MITRE ATT&CK T1070.'
- id: sentinel-analytics-rule-tampering
  name: Microsoft Sentinel Analytics Rule Tampering
  description: 'Analytics-Regeln werden deaktiviert oder verändert, etwa nach einem Zugriffsverlust des Erstellers, und laufen dann nicht mehr. Der Zugriffs-Token der Regel ist an den Ersteller gebunden, wenn Workspaces über Subscriptions oder Tenants gehen. Quelle: Threat-detection in Sentinel (Access permissions for analytics rules: Regel wird bei fehlendem Zugriff auto-disabled). MITRE ATT&CK T1070.'
- id: sentinel-watchlist-data-exposure
  name: Microsoft Sentinel Watchlist Data Exposure
  description: 'Watchlists mit sensiblen Daten, etwa Listen entlassener Mitarbeiter oder interner IP-Bereiche, bleiben nach der Untersuchung bestehen und sind für alle Leser des Workspace sichtbar. Quelle: Best-practices (Plan incident management: Watchlists nach Untersuchung löschen, damit keine sensiblen Daten bleiben). MITRE ATT&CK T1530.'
- id: fwm-global-policy-change-blast-radius
  name: Firewall Manager Global Policy Change
  description: 'Ein geänderter Basis-Policy-Eintrag wirkt auf alle assoziierten Firewalls in allen Regionen und Subscriptions. Ein kompromittiertes Konto mit Policy-Rechten kann so den gesamten Perimeter öffnen. Quelle: Firewall-Manager-Übersicht (Policy als globale Ressource), Azure-Firewall-Design-Guide (Policy-Hierarchie: Parent-Regeln haben Vorrang). MITRE ATT&CK T1078.004.'
- id: fwm-traffic-bypasses-firewall
  name: Firewall Manager Traffic Bypassing Firewall
  description: 'Private Verkehrsziele oder öffentliche IP-Bereiche, die im privaten Netz genutzt werden, werden nicht über die Firewall geleitet. Der Verkehr läuft ungefiltert zwischen Netzen. Quelle: Tutorial secure virtual hub (Routing: Private traffic via Firewall, zusätzliche Präfixe angeben). MITRE ATT&CK T1021.'
- id: fwm-fqdn-filter-dns-mismatch
  name: Firewall FQDN Filtering Bypass Through DNS Mismatch
  description: 'Clients lösen einen FQDN über einen anderen DNS-Server auf als die Firewall. Die FQDN-Regeln greifen dann nicht, oder der Client erreicht Ziele, die die Regel verbieten sollte. Quelle: Azure-Firewall-Design-Guide (cross-cloud: Caution zu DNS-Proxy und Client-DNS), Firewall-Manager-Policy-Vererbung (Threat-Intelligence-Modus nur verschärfbar). MITRE ATT&CK T1071.'
- id: sm-broad-target-rbac
  name: Storage Mover Agent Broad Target Access
  description: 'Der Agent erhält Rollen wie Storage Blob Data Contributor oder Storage File Data Privileged Contributor auf das Ziel. Ein kompromittierter Agent kann dadurch Zieldaten überschreiben oder löschen. Quelle: Storage-Mover „How to register an agent“ (Just-in-time-Autorisierung, Rollen auf Container- und Share-Ebene). MITRE ATT&CK T1078.004.'
- id: sm-orphaned-agent-role-assignments
  name: Storage Mover Orphaned Agent Role Assignments
  description: 'Nach dem Unregistrieren eines Agenten bleiben die Rollenzuweisungen am Ziel bestehen, sie zeigen auf einen nicht mehr existierenden Principal. Die Berechtigung ist verwaist und nicht sichtbar entfernt. Quelle: Storage-Mover „Decommissioning an agent“ (Unknown service principal bleibt bestehen), Agent-Registrierung (Warnung: Autorisierung wird nicht automatisch entfernt). MITRE ATT&CK T1078.004.'
- id: sm-control-plane-public-traffic
  name: Storage Mover Control Traffic on Public Endpoint
  description: 'Steuerungsnachrichten, Fortschrittstelemetrie und Copy-Logs laufen auch bei Private Link über den öffentlichen Endpunkt des Storage-Mover-Ressourcen. Metadaten zu Migrationen sind dadurch aus dem öffentlichen Netz erreichbar. Quelle: Storage-Mover „Storage Mover networking prerequisites“ (Some traffic can''t be routed through Private Link). MITRE ATT&CK T1040.'
- id: subnet-without-nsg
  name: Subnet Without Network Security Group
  description: 'Ein Subnetz ohne NSG hat keine Zugriffskontrolle. Zwischen Subnetzen gelten standardmäßig keine Netzwerkzugriffskontrollen, sodass Angreifer sich seitlich bewegen können. Quelle: Azure-Network-Security-Best-Practices (By default, no network access controls exist between subnets), VNets-and-Subnets-Design-Guide (NSG auf jedem Subnetz, deny by default). MITRE ATT&CK T1021.'
- id: subnet-broad-allow-rules
  name: Subnet NSG With Broad Allow Rules
  description: 'NSG-Regeln mit sehr weiten Quell- oder Zielbereichen erlauben mehr Verkehr als nötig. Sie erzeugen eine trügerische Sicherheit und werden von Red Teams regelmäßig ausgenutzt. Quelle: Azure-Network-Security-Best-Practices („Don''t assign allow rules with broad ranges“). MITRE ATT&CK T1190.'
- id: subnet-no-flow-logs
  name: Subnet NSG Without Flow Logs
  description: 'Ohne NSG-Flow-Logs bleibt unsichtbar, welche Verbindungen erlaubt oder verweigert wurden. Verdächtige Seitwärtsbewegung und Fehlkonfigurationen bleiben unentdeckt. Quelle: VNets-and-Subnets-Design-Guide (Enable NSG flow logs on every subnet-level NSG), Network-Watcher-NSG-Flow-Logs (Key properties). MITRE ATT&CK T1070.'
- id: vwan-udr-bypasses-hub-firewall
  name: Virtual WAN Route Override Bypasses Hub Firewall
  description: 'Benutzer mit RBAC-Rechten können über eine benutzerdefinierte Route Virtual-WAN-Routen für Spokes überschreiben und die Hub-Firewall umgehen. Quelle: Zero-Trust-Virtual-WAN (Step 3: RBAC-Rechte zum Zuweisen von UDRs einschränken, Network Contributor/routeTables/join). MITRE ATT&CK T1078.004.'
- id: vwan-flat-spoke-transit
  name: Virtual WAN Flat Spoke Transit
  description: 'Ohne eigene Routentabellen können Spoke-VNets und Zweigstellen untereinander kommunizieren, auch wenn sie getrennt sein sollten. Ein kompromittiertes Spoke erreicht dann andere Zonen. Quelle: Secure-Virtual-WAN (Use customer-managed routing for spoke segmentation), Architecture-Best-Practices-Virtual-WAN (Create custom route tables). MITRE ATT&CK T1021.'
- id: vwan-p2s-weak-authentication
  name: Virtual WAN Point-to-Site Weak Authentication
  description: 'Point-to-Site-VPN-Benutzer melden sich ohne Entra-ID-Bedingungen, MFA oder Gerätecompliance an. Gestohlene Zugangsdaten reichen für den Zugang ins Netz. Quelle: Architecture-Best-Practices-Virtual-WAN (Security 4: Microsoft Entra ID mit Conditional Access, MFA und Gerätecompliance). MITRE ATT&CK T1078.004.'
- id: lb-backend-directly-exposed
  name: Load Balancer Backend Directly Exposed
  description: 'Ein öffentlicher Load Balancer leitet Verkehr direkt auf die Backend-Instanzen, ohne Firewall oder WAF dazwischen. Die Backends sind dadurch direkt aus dem Internet angreifbar. Quelle: Architecture-Best-Practices-Azure-Load-Balancer (Protect the back-end servers: Firewall-Funktionen, Application Gateway/Front Door für HTTP). MITRE ATT&CK T1190.'
- id: lb-basic-sku-unsupported
  name: Basic Load Balancer Unsupported
  description: 'Basic Load Balancer wurde am 30. September 2025 eingestellt. Bestehende Instanzen sind nicht mehr unterstützt und haben keine SLA. Sicherheitspatches und Support fehlen. Quelle: Secure-Azure-Load-Balancer (Important: Basic Load Balancer retired). MITRE ATT&CK T1499.'
- id: lb-unencrypted-application-traffic
  name: Load Balancer Unencrypted Application Traffic
  description: 'Load Balancer arbeitet auf Schicht 4 und beendet kein TLS. Ist die Anwendung nicht selbst verschlüsselt, läuft der Verkehr im Klartext über das Netz. Quelle: Secure-Azure-Load-Balancer (Data protection 1–2: End-to-End-Verschlüsselung, TLS-Terminierung in Application Gateway/Front Door). MITRE ATT&CK T1040.'
- id: b2c-password-spraying
  name: Azure AD B2C Password Spraying
  description: 'Angreifer probieren wenige Passwörter gegen viele lokale Konten, um die Kontosperre zu umgehen. Smart Lockout und Passwortkomplexität begrenzen das. Quelle: Azure-AD-B2C-Technical-Overview (Smart account lockout, Password complexity), Mitigate-credential-attacks (Threat-Management). MITRE ATT&CK T1110.003.'
- id: b2c-account-takeover-no-risk-policy
  name: Azure AD B2C Account Takeover Without Risk Policy
  description: 'Ohne Conditional-Access-Richtlinie auf Benutzerrisiko bleiben risikoreiche Anmeldungen ohne Gegenmaßnahme. Ein kompromittiertes Konto wird nicht zur Passwortänderung gezwungen. Quelle: Conditional-Access-User-Flow (Template 2: user-risk-based Conditional Access, Password change bei medium/high). MITRE ATT&CK T1078.004. Hinweis: Azure AD B2C ist seit 1. Mai 2025 nicht mehr für Neukunden verfügbar.'
- id: b2c-single-factor-sign-in
  name: Azure AD B2C Single-Factor Sign-In
  description: 'Benutzerflows verlangen nur ein Passwort. Ein abgefangenes oder erratenes Passwort reicht für den Zugang zu allen angebundenen Anwendungen. Quelle: Enable-multifactor-authentication-in-Azure-AD-B2C (zweite Schutzebene für Sign-up und Sign-in). MITRE ATT&CK T1078.004.'
- id: esan-public-network-access
  name: Elastic SAN Public Network Access
  description: 'Der öffentliche Netzwerkzugang ist auf SAN-Ebene aktiv, obwohl nur Private Endpoints genutzt werden. Volumengruppen sind dann aus dem Internet erreichbar. Quelle: Elastic-SAN-Networking (Public network access: disable if exclusively using private endpoints). MITRE ATT&CK T1530.'
- id: esan-subnet-implicit-access
  name: Elastic SAN Implicit Subnet Access via Private Endpoint
  description: 'Die Genehmigung eines Private Endpoints gewährt implizit allen Verkehr aus dem Subnetz. Ohne Network Policies greifen NSG-Regeln für den Endpoint nicht, und der Zugriff ist nicht granular steuerbar. Quelle: Elastic-SAN-Networking (Control network traffic: implicit access), Configure-private-endpoints (Optional: network policies). MITRE ATT&CK T1021.'
- id: esan-unencrypted-transit-no-soft-delete
  name: Elastic SAN Unencrypted Transit and No Soft Delete
  description: 'Elastic SAN unterstützt keine Verschlüsselung in Transit und kein Soft Delete. Datenverkehr kann mitgelesen werden, und gelöschte Volumes lassen sich nicht wiederherstellen. Quelle: What-is-Azure-Elastic-SAN (Support for Storage features: Encryption in transit ⛔, Soft delete ⛔). MITRE ATT&CK T1040.'
- id: nat-outbound-traffic-unlogged
  name: NAT Gateway Outbound Traffic Not Logged
  description: 'Ohne NAT-Gateway-Flow-Logs ist nicht sichtbar, welche Ziele über die öffentliche NAT-IP erreicht werden. Unerwartete ausgehende Verbindungen bleiben unbemerkt. Quelle: Manage-StandardV2-NAT-Gateway-Flow-Logs (Why use flow logs: unerwartete ausgehende Verbindungen erkennen). MITRE ATT&CK T1070.'
- id: nat-snat-exhaustion
  name: NAT Gateway SNAT Exhaustion
  description: 'Erschöpfung der SNAT-Ports führt zu fehlgeschlagenen ausgehenden Verbindungen. Angreifer können dies durch viele Verbindungen auslösen, ohne dass ein Alarm ausgelöst wird. Quelle: Secure-your-Azure-NAT-Gateway-deployment (Configure SNAT exhaustion alerts, Datapath availability). MITRE ATT&CK T1499.'
- id: nat-unrestricted-egress-exfiltration
  name: NAT Gateway Unrestricted Egress Exfiltration
  description: 'Über das NAT-Gateway kann jedes Subnetz ungefiltert nach außen senden. Datenabfluss an externe Ziele wird nicht erkannt, wenn nur die Verbindungszahl überwacht wird. Quelle: Secure-your-Azure-NAT-Gateway-deployment (Logging and monitoring: unusual outbound activity), NAT-Gateway-Design (Service-tagged public IPs). MITRE ATT&CK T1048.'
- id: apic-test-console-credential-exposure
  name: API Center Test Console Credential Exposure
  description: 'Jeder Benutzer mit Zugriff auf das API-Center-Portal kann APIs mit hinterlegten API-Keys oder OAuth-Secrets testen. Die Credentials sind dann für alle Portalnutzer verfügbar. Quelle: Authorize-access-to-APIs-in-API-Center („When using API keys and OAuth 2.0 secrets, any user with access to the developer portal can use APIs“). MITRE ATT&CK T1078.004.'
- id: apic-broad-keyvault-access
  name: API Center Broad Key Vault Access
  description: 'Die Managed Identity des API Centers erhält zu breite Rechte auf den Key Vault, etwa Vollzugriff statt der Rolle Key Vault Secrets User. Kompromittierte Identitäten können dann alle Secrets lesen. Quelle: Authorize-access-to-APIs-in-API-Center (Option 2: Key Vault Secrets User, RBAC). MITRE ATT&CK T1078.004.'
- id: apic-unregistered-api
  name: API Center Unregistered API Exposure
  description: 'APIs, die nicht im API-Center-Inventar stehen, werden ohne Governance betrieben. Ihre Authentifizierung und Versionen sind nicht geprüft und bleiben unentdeckt. Quelle: Azure-API-Center-Overview (Create and maintain an organizational inventory, Govern your organization''s APIs). MITRE ATT&CK T1190.'
- id: bkp-no-multiuser-authorization
  name: Backup Vault Without Multi-User Authorization
  description: 'Kritische Operationen wie Deaktivieren von Soft Delete oder Reduzieren der Aufbewahrung laufen ohne zweite Freigabe. Ein Administrator mit Vault-Rechten kann Sicherungen damit allein vernichten. Quelle: Azure-Backup-Security-Best-Practices (MUA with Resource Guard), Protect-backups-from-ransomware-FAQ (Rogue-Admin-Szenario). MITRE ATT&CK T1078.004.'
- id: bkp-soft-delete-disabled
  name: Backup Vault Soft Delete Disabled
  description: 'Ohne Soft Delete sind gelöschte Sicherungen endgültig weg. Ein Angreifer mit Löschrechten entfernt die Wiederherstellungspunkte, ohne dass sie in einem Papierkorb landen. Quelle: Azure-Backup-Overview-Security (Soft delete, Security levels), Protect-backups-from-ransomware-FAQ (Soft delete recommendation). MITRE ATT&CK T1485.'
- id: bkp-mutable-recovery-points
  name: Backup Vault Mutable Recovery Points
  description: 'Ohne Unveränderbarkeit lassen sich Wiederherstellungspunkte vor Ablauf der Aufbewahrung löschen oder verkürzen. Ransomware, die Anmeldedaten kompromittiert, kann so auch die Sicherung zerstören. Quelle: Azure-Backup-Security-Best-Practices (Pillar 3: Immutability locked), Backup-Vault-Immutable-Concept (Immutable vault). MITRE ATT&CK T1490.'
- id: bkp-public-network-access
  name: Backup Vault Public Network Access
  description: 'Der Recovery-Services-Vault ist über das öffentliche Netz erreichbar, obwohl Azure Backup Private Endpoints unterstützt. Zugangsdaten können von außerhalb genutzt werden. Quelle: Azure-Backup-Security-Best-Practices (Policy „Azure Recovery Services vaults should disable public network access“), Security-overview (Private Endpoints for Azure Backup). MITRE ATT&CK T1530.'
- id: adls-acl-overgrant
  name: Data Lake Storage Individual ACL Entries
  description: 'ACL-Einträge für einzelne Benutzer oder Dienstprinzipale statt für Entra-Gruppen wachsen über die Zeit. Ausscheidende Personen behalten Zugriff, weil sie in jedem Unterverzeichnis einzeln entfernt werden müssen. Quelle: Access-control-lists-ADLS (FAQ: Use Microsoft Entra security groups as the assigned principal), Secure-Blob-Storage (Use RBAC for coarse and ACLs for fine access). MITRE ATT&CK T1078.004.'
- id: adls-anonymous-read
  name: Data Lake Storage Anonymous Read Access
  description: 'Anonymer Lesezugriff auf einen Container macht ACLs für Lesezugriffe wirkungslos. Jeder Internetnutzer kann die Dateien lesen. Quelle: Known-issues-ADLS (Access control lists and anonymous read access: ACLs have no effect on reads). MITRE ATT&CK T1530.'
- id: adls-incomplete-private-endpoints
  name: Data Lake Storage Missing DFS Private Endpoint
  description: 'Mit nur einem Private Endpoint für den Blob-Teil fehlt der DFS-Endpunkt. Operationen wie ACL-Verwaltung und Verzeichnislöschung leiten auf den öffentlichen Endpunkt um, oder sie schlagen fehl. Quelle: Known-issues-ADLS (Private endpoints: blob und dfs sub-resources). MITRE ATT&CK T1021.'
- id: queue-sas-overbroad
  name: Queue Storage Overbroad SAS Token
  description: 'Ein Service-SAS ohne gespeicherte Zugriffsrichtlinie kann nicht widerrufen werden und hat oft lange Laufzeit. Mit weiten Berechtigungen kann ein Angreifer Nachrichten lesen, verarbeiten oder löschen. Quelle: Security-recommendations-Queue-Storage (Scope SAS to least privilege; Service SAS ohne Policy: Laufzeit ≤ 1 Stunde). MITRE ATT&CK T1078.004.'
- id: queue-shared-key-auth
  name: Queue Storage Shared Key Authorization
  description: 'Anforderungen werden mit dem Kontoschlüssel signiert. Der Schlüssel gewährt vollen Zugriff auf das Konto, ist nicht einem Benutzer zuzuordnen und lässt sich über Code oder Konfiguration leicht verbreiten. Quelle: Security-recommendations-Queue-Storage (Use Entra ID to authorize access to queue data; Secure account keys with Key Vault), Authorize-data-access (Shared Key). MITRE ATT&CK T1078.004.'
- id: queue-open-network-access
  name: Queue Storage Open Network Access
  description: 'Das Speicherkonto ist aus allen Netzen erreichbar, weil keine Firewall oder Private Endpoints konfiguriert sind. Angreifer aus dem Internet können Nachrichten einsehen oder einspielen. Quelle: Security-recommendations-Queue-Storage (Networking: Limit network access, Use private endpoints). MITRE ATT&CK T1190.'
- id: vnet-no-ddos-protection
  name: Virtual Network Without DDoS Protection
  description: 'Öffentlich erreichbare Ressourcen in einem VNet ohne DDoS-Schutz sind volumetrischen und Protokollangriffen ausgeliefert. Adaptive Abwehr greift erst, wenn der Schutz aktiv ist. Quelle: DDoS-Protection-Fundamental-Best-Practices (Protect the network layer: Always-on traffic monitoring, DDoS Network Protection), Secure-DDoS-Protection (Protect every supported public IP). MITRE ATT&CK T1499.'
- id: vnet-public-paas-path
  name: Virtual Network Public PaaS Path
  description: 'PaaS-Dienste werden über öffentliche IP-Adressen statt über private Endpoints angesprochen. Die Angriffsfläche umfasst dann öffentliche Endpunkte, obwohl das Netz privat ist. Quelle: Architecture-best-practices-Azure-Virtual-Network (Security: private endpoints remove public IP addresses, reducing attack surface). MITRE ATT&CK T1190.'
- id: vnet-service-endpoint-exfiltration
  name: Virtual Network Service Endpoint Exfiltration Path
  description: 'Service-Endpoints auf allen Subnetzen öffnen Datenabflusskanäle zu PaaS-Diensten. Ein kompromittiertes System kann Daten auf ein fremdes Konto des gleichen Dienstes kopieren. Quelle: Mission-critical-security (Don''t enable virtual network service endpoints by default on all subnets: data exfiltration channels), Integrate-Azure-services-with-VNets (Compare private and service endpoints). MITRE ATT&CK T1048.'
- id: fw-no-threat-intelligence
  name: Azure Firewall Threat Intelligence Disabled
  description: 'Ohne Threat Intelligence im Modus Alert and deny kann Verkehr zu bekannten bösartigen IP-Adressen, Domains und URLs ungehindert fließen. Command-and-Control-Verbindungen werden nicht unterbunden. Quelle: Architecture-best-practices-Azure-Firewall (Enable threat intelligence in Alert and deny mode), Secure-Azure-Firewall-deployment (threat intelligence-based filtering). MITRE ATT&CK T1071.'
- id: fw-idps-not-blocking
  name: Azure Firewall IDPS Not Blocking
  description: 'IDPS läuft nur im Alert-Modus oder ist deaktiviert. Bekannte Exploit-Muster und Malware-Signaturen werden protokolliert, aber nicht blockiert. Quelle: Zero-Trust-Recommendations-Azure-Firewall (IDPS inspection enabled in deny mode), Architecture-best-practices-Azure-Firewall (IDPS in Alert oder Alert and deny). MITRE ATT&CK T1190.'
- id: fw-no-diagnostic-logging
  name: Azure Firewall Diagnostic Logging Disabled
  description: 'Ohne Diagnoseprotokolle fehlen Verbindungsentscheidungen, IDPS-Treffer und DNS-Proxy-Logs. Laterale Bewegungen und Angriffszeitlinien lassen sich nicht rekonstruieren. Quelle: Zero-Trust-Recommendations-Azure-Firewall (Diagnostic logging is enabled), Secure-Azure-Firewall-deployment (Data protection: Logs als sensibel behandeln). MITRE ATT&CK T1070.'
- id: fw-no-tls-inspection
  name: Azure Firewall TLS Inspection Disabled
  description: 'Ausgehender verschlüsselter Verkehr wird nicht entschlüsselt. IDPS und URL-Filterung sehen dann nur Metadaten, und Malware über HTTPS bleibt unsichtbar. Quelle: Zero-Trust-Recommendations-Azure-Firewall (Inspection of outbound TLS traffic is enabled), Azure-Firewall-Design-Guide (TLS inspection Premium). MITRE ATT&CK T1071.'
- id: mhsm-no-purge-protection
  name: Managed HSM Without Purge Protection
  description: 'Ohne Purge Protection kann ein Administrator den HSM oder einzelne Schlüssel endgültig löschen, bevor die Aufbewahrung abläuft. Verschlüsselte Daten sind dann unwiederbringlich verloren. Quelle: Managed-HSM-soft-delete-and-purge-protection (Purge protection: prevents deletion by a malicious insider), Secure-Managed-HSM (Enable purge protection). MITRE ATT&CK T1485.'
- id: mhsm-single-person-security-domain
  name: Managed HSM Security Domain Single Custodian
  description: 'Die Security Domain ist nicht über ein Quorum mit mehreren Schlüsselinhabern abgesichert. Eine einzelne Person kann den HSM wiederherstellen oder kontrollieren. Quelle: Secure-Managed-HSM (Implement multiperson control for security domain, minimum three keys), Security-domain-overview. MITRE ATT&CK T1078.004.'
- id: mhsm-no-key-autorotation
  name: Managed HSM Keys Without Autorotation
  description: 'Schlüssel werden nicht automatisch rotiert. Ein abgeflossener Schlüssel bleibt über lange Zeit gültig, und ältere Schlüssel werden weiter verwendet. Quelle: Secure-Managed-HSM (Configure automated key rotation), Reliability-Managed-HSM (Backup and restore). MITRE ATT&CK T1552.'
- id: aci-plaintext-cli-credentials
  name: Container Instances Plaintext Credentials in CLI
  description: 'Zugangsdaten, die über die CLI übergeben werden, werden im Backend im Klartext gespeichert. Wer Zugriff auf die Konfiguration hat, liest sie aus. Quelle: Best-practices-and-considerations-ACI (User''s credentials passed via CLI are stored as plain text; use environment variables). MITRE ATT&CK T1552.001.'
- id: aci-untrusted-images
  name: Container Instances Untrusted Container Images
  description: 'Images stammen aus öffentlichen Registries ohne Prüfung. Jede Schicht kann Schwachstellen oder Schadcode enthalten. Quelle: Security-considerations-ACI (Use a private registry; monitor and scan container images). MITRE ATT&CK T1195.'
- id: aci-no-network-segmentation
  name: Container Instances Without Network Segmentation
  description: 'Container-Gruppen laufen ohne VNet-Integration und ohne NSG. Sie sind vom übrigen Netz nicht abgegrenzt, und seitliche Bewegung ist möglich. Quelle: Security-baseline-ACI (NS-1: Deploy into VNet; NSG rules). MITRE ATT&CK T1021.'
- id: aci-privileged-root-container
  name: Container Instances Privileged Container Runtime
  description: 'Container laufen mit unnötigen Rechten oder als root. Bei einem Ausbruch aus dem Container erhält der Angreifer root-Rechte auf dem Host. Quelle: Security-considerations-ACI (Considerations for the container ecosystem: privilegierte Container laufen als root, unnötige Prozesse entfernen). MITRE ATT&CK T1068.'
- id: agw-no-waf
  name: Application Gateway Without WAF
  description: 'Der Application Gateway läuft ohne WAF-Richtlinie. Gängige Angriffe wie SQL-Injection und Cross-Site-Scripting erreichen die Anwendung ungefiltert. Quelle: Secure-Application-Gateway (Web application protection 1: WAF v2 für internetseitige Anwendungen), Architecture-best-practices-Application-Gateway-v2 (Block common threats at the edge). MITRE ATT&CK T1190.'
- id: agw-weak-tls-policy
  name: Application Gateway Weak TLS Policy
  description: 'Die TLS-Richtlinie erlaubt ältere Protokollversionen oder schwache Chiffren. Verbindungen können auf schwache Verschlüsselung zurückgestuft werden. Quelle: Architecture-best-practices-Application-Gateway-v2 (Set up a TLS policy; latest version, TLS 1.2 und stärker). MITRE ATT&CK T1040.'
- id: agw-unencrypted-backend
  name: Application Gateway Unencrypted Backend Traffic
  description: 'Der Verkehr zwischen Gateway und Backend läuft unverschlüsselt. Ein Angreifer im Netz kann Sitzungsdaten mitlesen. Quelle: Configure-end-to-end-TLS-Application-Gateway (Backend authentication with certificates; end-to-end TLS). MITRE ATT&CK T1040.'
- id: agw-broad-management-rbac
  name: Application Gateway Broad Management Rights
  description: 'Administratoren haben breite Netzwerkrechte auf Gateway, WAF-Richtlinie, VNet und Key-Vault-Zertifikate. Ein kompromittiertes Konto kann Routing und Zertifikate verändern. Quelle: Secure-Application-Gateway (Identity and access management 2–3: least privilege, Conditional Access). MITRE ATT&CK T1078.004.'
- id: bastion-open-rdp-ssh
  name: Bastion Target Subnet Open RDP/SSH
  description: 'Die NSG des Zielsubnetzes lässt RDP oder SSH aus dem Internet zu, obwohl Bastion den Zugang bereitstellt. Der direkte Zugang umgeht den Bastion-Schutz. Quelle: Configure-NSG-rules-Azure-Bastion (Target VM subnet: Ingress nur von AzureBastionSubnet), Azure-network-security-best-practices (Zero Trust). MITRE ATT&CK T1021.'
- id: bastion-no-entra-auth
  name: Bastion Local Credential Authentication
  description: 'Bastion-Sitzungen verwenden lokale Konten oder Schlüssel. Verteilte Zugangsdaten sind schwer zu verwalten, und MFA sowie Conditional Access greifen nicht. Quelle: Secure-Azure-Bastion (Entra ID authentication for SSH/RDP), Design-secure-hub-spoke-network (Entra ID for SSH/RDP). MITRE ATT&CK T1078.004.'
- id: bastion-public-ip-on-vm
  name: Virtual Machines Behind Bastion With Public IP
  description: 'VMs, die über Bastion erreichbar sein sollen, haben trotzdem öffentliche IP-Adressen. Die Angriffsfläche bleibt bestehen, obwohl ein sicherer Zugang existiert. Quelle: Developer-and-admin-access-to-Azure-VMs (Use Bastion or P2S VPN instead of public IPs; remove public IPs). MITRE ATT&CK T1190.'
- id: dhsm-default-admin-password
  name: Dedicated HSM Default Admin Password
  description: 'Das Standardpasswort des Mandanten-Administrators ist nach der Bereitstellung noch gesetzt. Wer es kennt, übernimmt die Verwaltung des HSM. Quelle: Secure-Dedicated-HSM (Identity and access management 1: change default passwords immediately after provisioning). MITRE ATT&CK T1078.001.'
- id: dhsm-role-lockout
  name: Dedicated HSM Role Lockout by Failed Sign-Ins
  description: 'Fehlgeschlagene Anmeldungen zerstören die Rolle HSM SO nach drei Versuchen und Partition SO nach zehn. Bei Fehlern im Betrieb verliert das HSM seine Schlüssel. Quelle: Secure-Dedicated-HSM (Identity and access management 6: role lockout thresholds, Failed sign-ins). MITRE ATT&CK T1110.'
- id: dhsm-no-ha-backup
  name: Dedicated HSM Without High Availability or Backup
  description: 'Ein einzelnes HSM ohne HA-Partner und ohne Schlüsselsicherung führt bei Ausfall zu dauerhaftem Schlüsselverlust. Die Dienste, die auf die Schlüssel angewiesen sind, fallen aus. Quelle: Secure-Dedicated-HSM (Backup and recovery 1–2: HSM-Paare, regelmäßige Schlüsselsicherung). MITRE ATT&CK T1485.'
- id: er-unencrypted-private-peering
  name: ExpressRoute Unencrypted Private Peering
  description: 'ExpressRoute verschlüsselt den Verkehr auf dem privaten Peering nicht standardmäßig. Daten zwischen Standort und Azure sind auf der Leitung im Klartext, wenn keine Verschlüsselung eingerichtet ist. Quelle: About-encryption-for-ExpressRoute (Point-to-point encryption by MACsec; IPsec end-to-end), Architecture-best-practices-ExpressRoute (Security: IPsec for private peering). MITRE ATT&CK T1040.'
- id: er-bgp-session-unauthenticated
  name: ExpressRoute Unauthenticated BGP Sessions
  description: 'BGP-Sitzungen sind nicht mit MD5 authentifiziert. Ein Angreifer im Transportnetz kann gefälschte Routen einspielen und Verkehr umleiten. Quelle: Secure-ExpressRoute-deployment (Data protection 2: MD5 for BGP sessions), ExpressRoute-routing-requirements. MITRE ATT&CK T1557.'
- id: er-broad-circuit-rbac
  name: ExpressRoute Broad Circuit Management Rights
  description: 'Benutzer mit breiten Rechten können Circuits, Gateways und Routing ändern. Eine Fehlkonfiguration oder ein kompromittiertes Konto unterbricht die Verbindung oder leitet Verkehr um. Quelle: Architecture-best-practices-ExpressRoute (Security: Azure RBAC for ExpressRoute resources). MITRE ATT&CK T1078.004.'
- id: la-broad-workspace-access
  name: Log Analytics Broad Workspace Access
  description: 'Benutzer mit Workspace-Rechten sehen alle Tabellen, auch wenn sie nur Daten einzelner Ressourcen benötigen. Sensible Protokolle werden so breit sichtbar. Quelle: Manage-access-to-Log-Analytics-workspaces (Access control mode; table-level RBAC), Best-practices-Azure-Monitor-Logs (Grant access based on need). MITRE ATT&CK T1530.'
- id: la-public-ingestion-endpoint
  name: Log Analytics Public Ingestion and Query Endpoint
  description: 'Der Workspace ist über öffentliche Endpunkte für Ingestion und Abfragen erreichbar, ohne Private Link. Logs lassen sich aus dem Internet einspielen oder abfragen. Quelle: Architecture-best-practices-Log-Analytics (Use private link), Best-practices-Azure-Monitor-Logs (Block workspace access from public networks). MITRE ATT&CK T1190.'
- id: la-log-tampering
  name: Log Analytics Records Purged or Altered
  description: 'Daten im Workspace lassen sich nicht ändern, aber löschen (purge). Ohne Export in unveränderbaren Speicher gehen Auditspuren verloren, etwa nach einem Angriff. Quelle: Architecture-best-practices-Log-Analytics (Data export with immutability policies; data can be purged). MITRE ATT&CK T1070.'
- id: mon-vm-agent-public-channel
  name: Azure Monitor VM Agent Public Channel
  description: 'Monitoring-Agenten auf VMs senden Telemetrie über öffentliche Endpunkte. Ohne Private Link läuft der Datenweg über das öffentliche Netz und ist nicht auf das Netz beschränkt. Quelle: Secure-your-Azure-Monitor-deployment (Virtual machine monitoring: connect VMs through private endpoint). MITRE ATT&CK T1040.'
- id: mon-used-as-security-monitoring
  name: Azure Monitor Used Instead of Security Monitoring
  description: 'Azure Monitor sammelt Sicherheitsereignisse, ist aber nicht für Sicherheitsüberwachung gedacht. Erkennungsregeln, Korrelation und Reaktion fehlen. Angriffe bleiben unentdeckt. Quelle: Secure-your-Azure-Monitor-deployment (Implement security monitoring of VMs using Defender for Cloud and Sentinel). MITRE ATT&CK T1070.'
- id: mon-legacy-cluster-certificate-auth
  name: Container Insights Legacy Certificate Authentication
  description: 'Cluster verbinden sich mit Container Insights über zertifikatsbasierte lokale Authentifizierung. Zertifikate werden verteilt und seltener rotiert als verwaltete Identitäten. Quelle: Best-practices-for-monitoring-Kubernetes-with-Azure-Monitor (Connect clusters using managed identity; migrate from legacy authentication). MITRE ATT&CK T1552.'
- id: ai-api-key-exposure
  name: AI Services API Key Exposure
  description: 'API-Schlüssel für Azure OpenAI oder AI Services liegen in Code, Konfiguration oder Logs. Wer sie besitzt, kann Modelle auf Kosten der Organisation nutzen und Daten abfragen. Quelle: Azure-AI-security-best-practices (Use managed identity instead of API keys, eliminating the need to manage and rotate secrets). MITRE ATT&CK T1552.001.'
- id: ai-prompt-injection
  name: AI Services Prompt Injection
  description: 'Eingaben manipulieren das Modell, um Schutzregeln zu umgehen oder vertrauliche Daten auszugeben. Ohne Inhaltsfilterung und Sicherheits-Meta-Prompts wirkt die Manipulation direkt. Quelle: Azure-AI-security-best-practices (Implement multilayered content filtering; safety meta-prompts; Prompt Shields). MITRE ATT&CK T1190.'
- id: ai-public-endpoint
  name: AI Services Public Endpoint Exposure
  description: 'Der öffentliche Endpunkt des AI-Dienstes ist erreichbar, ohne Private Endpoint oder Netzwerkregeln. Modelle und Daten lassen sich aus dem Internet ansprechen. Quelle: Azure-AI-security-best-practices (Use private endpoints for network isolation); Configure-secure-networking-for-Azure-AI-platform-services (Create private endpoints for all AI platform services). MITRE ATT&CK T1530.'
- id: appi-instrumentation-key-as-credential
  name: Application Insights Instrumentation Key Misused
  description: 'Der Instrumentation Key wird als Sicherheitsschlüssel behandelt, ist aber nur eine Kennung. Ohne Microsoft Entra Authentifizierung kann jeder mit dem Schlüssel Telemetrie einspielen und die Daten verfälschen. Quelle: Connection-strings-in-Application-Insights (Ikey values aren''t security tokens; authenticated ingestion via Microsoft Entra). MITRE ATT&CK T1078.004.'
- id: appi-telemetry-exposes-data
  name: Application Insights Sensitive Data in Telemetry
  description: 'Telemetrie enthält personenbezogene oder geheime Werte aus Requests und Logs. Der Workspace speichert diese Daten und macht sie für Leser sichtbar. Quelle: Application-Insights-FAQ und Best-practices-Azure-Monitor-Logs (Purge sensitive data; obfuscation). MITRE ATT&CK T1530.'
- id: appi-connection-string-in-config
  name: Application Insights Connection String in Plaintext Configuration
  description: 'Die Verbindungszeichenfolge steht im Klartext in App-Einstellungen oder Quellcode. Jeder mit Lesezugriff auf die Konfiguration kann Telemetrie senden und Endpunkte umleiten. Quelle: Application-Insights-FAQ (use environment variables; connection strings for ingestion). MITRE ATT&CK T1552.001.'
- id: ddos-unprotected-public-ip
  name: Public IP Without DDoS Protection
  description: 'Öffentliche IP-Adressen im Netz sind nicht durch DDoS Protection abgedeckt. Volumetrische und Protokollangriffe erreichen die Ressourcen ohne adaptive Abwehr. Quelle: Secure-Azure-DDoS-Protection (Protect every supported public IP resource). MITRE ATT&CK T1499.'
- id: ddos-unsupported-deployment
  name: DDoS Protection Gap on Unsupported Deployment
  description: 'Ressourcen mit NAT-Gateway-IPs, klassischen VMs oder Virtual WAN werden von DDoS Protection nicht geschützt. Der Schutz wirkt nur auf unterstützte Konfigurationen. Quelle: About-Azure-DDoS-Protection-Tier-Comparison (Limitations). MITRE ATT&CK T1499.'
- id: ddos-no-attack-telemetry
  name: DDoS Attacks Without Telemetry
  description: 'Ohne Diagnoseeinstellungen fehlen DDoS-Metriken und Angriffsprotokolle. Angriffe bleiben unbemerkt, und die Nachweise für Kostenerstattung und Analyse fehlen. Quelle: DDoS-protection-for-Azure-networks-cross-cloud (Prerequisites: Azure Monitor configuration). MITRE ATT&CK T1499.'
- id: defender-coverage-gap
  name: Defender for Cloud Coverage Gap
  description: 'Nicht alle Subscriptions und Ressourcen sind in Defender for Cloud aufgenommen. Angriffsfläche und Fehlkonfigurationen bleiben außerhalb der Bewertung. Quelle: Defender-for-Cloud-Introduction (CSPM, multicloud coverage); Planning-and-operations-guide (Monitor for new or changed resources). MITRE ATT&CK T1562.'
- id: defender-unremediated-recommendations
  name: Defender for Cloud Unremediated Recommendations
  description: 'Empfehlungen werden nicht bearbeitet, obwohl sie kritische Fehlkonfigurationen melden. Der Secure Score bleibt niedrig, und bekannte Angriffswege bleiben offen. Quelle: Security-policies-in-Defender-for-Cloud (Security recommendations: Schweregrad und Behebung); Planning-and-operations-guide (Security policies and recommendations). MITRE ATT&CK T1190.'
- id: defender-unprotected-container-registry
  name: Defender for Containers Not Enabled
  description: 'Ohne Defender for Containers werden Images nicht auf Schwachstellen geprüft und Angriffe auf den Kontrollpunkt von Kubernetes nicht erkannt. Quelle: Enable-Defender-for-Containers (Enable the Defender for Containers plan; registry access; agentless threat protection). MITRE ATT&CK T1610.'
- id: afs-public-endpoint-exposure
  name: Azure File Sync Public Endpoint Exposure
  description: 'Der öffentliche Endpunkt des Storage Sync Service ist erreichbar, obwohl Private Endpoints verfügbar sind. Agenten und Clients können von außerhalb des Netzes verbinden. Quelle: Networking-considerations-for-Azure-File-Sync (Private endpoints: disable public endpoints). MITRE ATT&CK T1190.'
- id: afs-identity-misconfiguration
  name: Azure File Sync Identity Misconfiguration
  description: 'Freigaben werden nur über Speicherkontoschlüssel oder ohne Domänen-Authentifizierung angesprochen. Berechtigungen auf den Cloud-Freigaben lassen sich nicht über AD DS durchsetzen. Quelle: Hybrid-file-services (Considerations 1–2: AD DS identity, domain-join storage account). MITRE ATT&CK T1078.004.'
- id: afs-no-backup
  name: Azure File Sync Without Backup
  description: 'Die Freigaben sind nicht durch Azure Files Backup geschützt. Versehentliches oder bösartiges Löschen lässt sich nicht rückgängig machen. Quelle: Hybrid-file-services (Considerations 5: Azure Files backup, snapshot and vaulted backups). MITRE ATT&CK T1485.'
- id: hdi-standard-cluster-no-authentication
  name: HDInsight Standard Cluster Without Authentication
  description: 'Standardcluster laufen ohne Authentifizierung für HiveServer2, und Autorisierung über Ranger ist nicht verfügbar. Jeder im Netz kann Abfragen ausführen und Daten lesen. Quelle: Security-options-for-Hive-in-HDInsight (HiveServer2 authentication: default none for standard clusters). MITRE ATT&CK T1078.004.'
- id: hdi-ssl-and-transport-gaps
  name: HDInsight Unencrypted Cluster Communication
  description: 'Die Kommunikation zwischen den Clusterknoten ist nicht über IPsec verschlüsselt, und die Gateway-Verbindung ist nicht durchgehend TLS-geschützt. Abgefangene Daten sind lesbar. Quelle: Security-options-for-Hive-in-HDInsight (SSL on the gateway; encryption in transit with IPsec). MITRE ATT&CK T1040.'
- id: hdi-keytab-exposure
  name: HDInsight Kerberos Keytab Exposure
  description: 'Keytab-Dateien für Domänenbenutzer liegen ungeschützt auf den Clusterknoten oder in Skripten. Wer sie kopiert, kann sich ohne Passwort als dieser Benutzer authentifizieren. Quelle: Enterprise-security-general-information-and-guidelines-in-Azure-HDInsight (Generate domain user keytabs); HDInsight-FAQ (How do I create a keytab). MITRE ATT&CK T1552.'
- id: tm-unauthorized-profile-change
  name: Traffic Manager Unauthorized Profile Change
  description: 'Ein Angreifer mit Schreibrechten auf das Profil ändert Endpunkte oder Routing und leitet Nutzer zu bösartigen Zielen. Quelle: Architecture-best-practices-Traffic-Manager (Prevent unauthorized modification of traffic routing; RBAC on the control plane). MITRE ATT&CK T1565.'
- id: tm-dangling-dns-takeover
  name: Traffic Manager Dangling DNS Subdomain Takeover
  description: 'Ein DNS-Eintrag zeigt auf eine gelöschte Azure-Ressource. Ein Angreifer belegt die Ressource neu und übernimmt die Subdomain. Quelle: Architecture-best-practices-Traffic-Manager (Harden DNS entries; Prevent dangling DNS entries). MITRE ATT&CK T1584.003.'
- id: tm-http-health-probes
  name: Traffic Manager HTTP Health Probes
  description: 'Endpunkte werden per HTTP statt HTTPS überwacht, und die Probes validieren keine Zertifikate. Gefälschte Antworten können den Zustand eines Endpunkts verfälschen. Quelle: Secure-your-Azure-Traffic-Manager-deployment (Use HTTPS for monitoring; probes don''t validate certificate validity). MITRE ATT&CK T1557.'
- id: waf-detection-mode-in-production
  name: Web Application Firewall Detection Mode in Production
  description: 'Die WAF läuft im Erkennungsmodus, obwohl Anwendungen produktiv sind. Erkannte Angriffe werden protokolliert, aber nicht blockiert. Quelle: WAF-Best-practices-Front-Door (Use prevention mode; detection mode provides no protection). MITRE ATT&CK T1190.'
- id: waf-no-rate-limit-or-bot-protection
  name: Web Application Firewall Without Rate Limit or Bot Protection
  description: 'Ohne Ratenlimit und Bot-Schutz können Anfragefluten, Scraping und Credential Stuffing die Anwendung überlasten oder Konten angreifen. Quelle: Secure-your-Azure-WAF-deployment (Implement rate limiting; Enable bot protection). MITRE ATT&CK T1499.'
- id: waf-logs-not-collected
  name: Web Application Firewall Logs Not Collected
  description: 'WAF-Diagnoseprotokolle werden nicht an ein Zielsystem gesendet. Blockierte Angriffe und Regelauslösungen lassen sich nicht nachvollziehen. Quelle: Secure-your-Azure-WAF-deployment (Logging and monitoring 1–2: diagnostic settings, Microsoft Sentinel). MITRE ATT&CK T1070.'
- id: la-secrets-in-workflow
  name: Logic Apps Secrets Embedded in Workflows
  description: 'Zugangsdaten stehen direkt in Workflow-Definitionen oder Verbindungen statt in Key Vault. Wer die Definition lesen kann, erhält die Geheimnisse. Quelle: Azure-security-baseline-Logic-Apps (IM-8: Secrets in Key Vault, app settings), Best-practices-protecting-secrets (Access control). MITRE ATT&CK T1552.001.'
- id: la-no-managed-identity
  name: Logic Apps Without Managed Identity
  description: 'Workflows authentifizieren sich mit Dienstprinzipalen oder Schlüsseln statt mit einer verwalteten Identität. Die Anmeldedaten müssen verwaltet, rotiert und geschützt werden. Quelle: Azure-security-baseline-Logic-Apps (Identity management: use managed identities instead of service principals). MITRE ATT&CK T1078.004.'
- id: la-anonymous-request-trigger
  name: Logic Apps Anonymous Request Trigger
  description: 'Ein HTTP-Request-Trigger akzeptiert Aufrufe ohne Authentifizierung. Jeder, der die URL kennt, kann den Workflow auslösen und Daten einspielen. Quelle: Azure-security-baseline-Logic-Apps (Service principals: AAD authentication for Logic Apps Request triggers). MITRE ATT&CK T1190.'
- id: nw-overbroad-packet-capture
  name: Network Watcher Overbroad Packet Capture Rights
  description: 'Breite Rechte auf Packet Captures erlauben es, Nutzdaten des Netzwerkverkehrs abzugreifen. Die Erfassung installiert eine Erweiterung auf der VM. Quelle: Secure-your-Azure-Network-Watcher-deployment (Limit who can initiate packet captures; RBAC for Network Watcher). MITRE ATT&CK T1040.'
- id: nw-flow-log-storage-exposure
  name: Network Watcher Flow Log Storage Exposure
  description: 'Speicherkonten mit Flow-Logs und Packet Captures sind über das öffentliche Netz erreichbar. Verbindungsmetadaten und Nutzdaten lassen sich abrufen. Quelle: Secure-your-Azure-Network-Watcher-deployment (Network security 2–3: restrict access, private endpoints for flow log storage). MITRE ATT&CK T1530.'
- id: nw-nsg-flow-log-retirement-gap
  name: Network Watcher NSG Flow Log Retirement Gap
  description: 'NSG-Flow-Logs können seit dem 30. Juni 2025 nicht mehr neu angelegt werden und werden am 30. September 2027 eingestellt. Ohne Migration entsteht eine Lücke in der Netzwerkprotokollierung. Quelle: Secure-your-Azure-Network-Watcher-deployment (Network security 1: migrate from NSG flow logs to virtual network flow logs). MITRE ATT&CK T1070.'
- id: sf-unsecured-cluster
  name: Service Fabric Unsecured Cluster
  description: 'Der Cluster ist ohne Zertifikat oder Windows-Sicherheit betrieben, sodass anonyme Clients Verwaltungsoperationen ausführen können. Die Sicherheit lässt sich nach der Erstellung nicht mehr einschalten. Quelle: Best-practices-for-Azure-Service-Fabric-security (Always secure your clusters; configure security only at creation). MITRE ATT&CK T1190.'
- id: sf-shared-client-certificate
  name: Service Fabric Shared Client Certificate
  description: 'Clientzertifikate werden unter mehreren Benutzern des Service Fabric Explorers geteilt, und ihr Ablauf wird nicht überwacht. Ein gestohlenes Zertifikat gibt vollen Clusterzugriff. Quelle: Service-Fabric-cluster-security-scenarios (Client-to-node security: don''t distribute cluster client certificates), Architecture-best-practices-Service-Fabric (Create a process to monitor expiration). MITRE ATT&CK T1552.'
- id: sf-public-management-endpoints
  name: Service Fabric Public Management Endpoints
  description: 'Verwaltungsendpunkte sind über das öffentliche Netz erreichbar, statt über Jump-Server und eingeschränkte NSGs. Die Angriffsfläche des Clusters wird unnötig groß. Quelle: Best-practices-for-Azure-Service-Fabric-security (Create perimeter networks with NSGs; jump servers), Use-network-isolation-Service-Fabric. MITRE ATT&CK T1190.'
- id: vmss-unpatched-instances
  name: VM Scale Set Unpatched Instances
  description: 'Instanzen einer Scale Set bleiben ohne Updates, weil der Upgrade-Modus manuell ist oder automatische OS-Image-Upgrades fehlen. Bekannte Schwachstellen bleiben über Monate offen. Quelle: Architecture-best-practices-VMs-and-scale-sets (Keep your VMs up to date by setting an upgrade policy); Baseline-VMSS (Automatic OS image upgrades; Auto Guest Patching). MITRE ATT&CK T1068.'
- id: vmss-special-instances-modified
  name: VM Scale Set Protected Instances Modified
  description: 'Besondere Instanzen, die andere Aufgaben erfüllen, werden durch Skalierung oder Scale-Set-Aktionen verändert oder entfernt. Ihre Konfiguration und Daten gehen verloren oder werden überschrieben. Quelle: Instance-Protection-for-VMSS-instances (protectFromScaleIn, protectFromScaleSetActions). MITRE ATT&CK T1565.'
- id: vmss-no-application-health
  name: VM Scale Set Without Application Health Monitoring
  description: 'Ohne Application Health Extension oder Health Probe erkennt die Scale Set keine fehlerhaften Instanzen. Rolling Upgrades und automatische Reparaturen greifen nicht, und kompromittierte Instanzen bleiben im Betrieb. Quelle: Using-Application-Health-extension-with-VMSS (Only one source of health monitoring; required for rolling upgrades), Upgrade-policy-modes (Rolling upgrade requires health monitoring). MITRE ATT&CK T1499.'
- id: mg-api-keys-and-service-accounts
  name: Managed Grafana API Keys and Service Accounts Enabled
  description: 'API-Schlüssel und Dienstkonten sind aktiv und umgehen die Anmeldung über Microsoft Entra ID und MFA. Tokens ohne Ablauf bleiben über lange Zeit gültig. Quelle: Secure-Azure-Managed-Grafana (Service-specific security 1–2: disable API keys and service accounts; token expiration). MITRE ATT&CK T1078.004.'
- id: mg-public-network-access
  name: Managed Grafana Public Network Access
  description: 'Die Grafana-Instanz ist über das öffentliche Netz erreichbar, ohne Private Endpoint. Dashboards und Datenquellen sind aus dem Internet ansprechbar. Quelle: Secure-Azure-Managed-Grafana (Network security 1–2: private endpoints, disable public access), Set-up-private-access. MITRE ATT&CK T1190.'
- id: mg-datasource-credentials
  name: Managed Grafana Data Source Credentials Stored
  description: 'Zugangsdaten für Datenquellen sind in Grafana gespeichert, statt über verwaltete Identität oder Current-User-Authentifizierung. Wer Grafana-Administratorzugriff hat, liest die Geheimnisse. Quelle: Secure-Azure-Managed-Grafana (Data protection 2; Identity and access management 3: managed identity and Current User authentication). MITRE ATT&CK T1552.001.'
- id: kv-public-network-exposure
  name: Key Vault Reachable From Public Networks
  description: 'Actor: external attacker or stolen-credential holder. Prerequisite: public network access enabled and no firewall rules. Action: connects to the vault data plane from the internet. Impact: reads or modifies secrets, keys and certificates. Quelle: MCSB v2 NS-2; baseline feature „Disable Public Network Access“; Disable public network access using the Key Vault firewall IP filtering rules.'
- id: kv-no-private-endpoint
  name: Key Vault Access Path Not Private
  description: 'Actor: insider or attacker in a connected network. Prerequisite: vault reachable through a public endpoint, no private endpoint. Action: uses the public endpoint from an unmanaged network. Impact: access to secrets bypasses network segmentation. Quelle: MCSB v2 NS-2; baseline feature „Azure Private Link“; Deploy private endpoints for Azure Key Vault.'
- id: kv-service-principal-secret
  name: Application Credential Held as Service Principal Secret
  description: 'Actor: attacker who obtains a service principal secret or certificate. Prerequisite: application authenticates with a service principal instead of a managed identity. Action: authenticates to Key Vault as the service principal. Impact: reads every secret that the principal can access, persistently. Quelle: MCSB v2 IM-3; baseline feature „Managed Identities“; Use Azure managed identities instead of service principals when possible.'
- id: kv-secrets-embedded-in-code
  name: Vault Secret Copied Into Code or Configuration
  description: 'Actor: anyone with read access to code, pipelines or configuration. Prerequisite: a secret was copied out of the vault into source or app settings. Action: reads the plaintext secret from the repository, log or configuration. Impact: the secret is exposed outside the vault controls and its rotation. Quelle: MCSB v2 IM-8; baseline feature „Service Credential Storage in Key Vault“; Ensure that secrets and credentials are stored in secure locations such as Azure Key Vault.'
- id: kv-no-conditional-access
  name: Vault Access Without Conditional Access Conditions
  description: 'Actor: attacker with a valid but risky sign-in. Prerequisite: no conditional access policy restricts data plane sign-ins. Action: signs in from an untrusted location or unmanaged device. Impact: data plane access granted without location, device or risk checks. Quelle: MCSB v2 IM-7; baseline feature „Conditional Access for Data Plane“; Define the applicable conditions and criteria for Azure AD conditional access.'
- id: kv-broad-data-plane-role
  name: Key Vault Data Plane Role Broader Than Needed
  description: 'Actor: insider or compromised identity with a vault-level role assignment. Prerequisite: role such as Key Vault Administrator or Contributor assigned at vault scope. Action: reads or purges secrets and keys beyond the application''s need. Impact: unnecessary access to all vault objects, including destructive operations. Quelle: MCSB v2 PA-7; baseline feature „Azure RBAC for Data Plane“; Use Azure RBAC to manage Azure resource access through built-in role assignments.'
- id: kv-non-expiring-keys
  name: Cryptographic Keys Without Expiration
  description: 'Actor: attacker who obtains a key. Prerequisite: keys created without an expiration date. Action: uses the key indefinitely after compromise. Impact: an unlimited time window for abuse and no forced rotation. Quelle: MCSB v2 DP-6; baseline feature „Key Management in Azure Key Vault“.'
- id: kv-no-customer-managed-key
  name: Data Encrypted Only With Platform Keys Where Compliance Requires Customer Keys
  description: 'Actor: regulator or auditor. Prerequisite: regulated workload stores data encrypted only with Microsoft-managed keys. Action: cannot demonstrate customer control over key lifecycle or revocation. Impact: compliance gap and no customer-side revocation of data access. Quelle: MCSB v2 DP-5; baseline feature „Data at Rest Encryption Using CMK“; Azure Key Vault is where you store your keys for CMK encryption.'
- id: kv-accidental-permanent-deletion
  name: Vault Objects Permanently Deleted
  description: 'Actor: administrator with delete rights, insider or ransomware with vault access. Prerequisite: soft delete or purge protection disabled. Action: deletes and purges a key vault or its keys and secrets. Impact: permanent loss of cryptographic material that protected other data. Quelle: MCSB v2 BR-1; baseline feature „Service Native Backup Capability“; Use Azure Key Vault native backup feature; current guidance: soft delete and purge protection (secure-key-vault, data protection 1-2).'
- id: kv-no-resource-logs
  name: Vault Activity Not Logged
  description: 'Actor: attacker or insider who reads or changes secrets. Prerequisite: resource logs not enabled or not sent to a workspace. Action: performs key or secret operations without a trace. Impact: no evidence for investigation and no alert on misuse. Quelle: MCSB v2 LT-4; baseline feature „Azure Resource Logs“; Enable resource logs for your key vault; log key operation activities.'
- id: kv-defender-not-enabled
  name: Key Vault Threat Detection Not Enabled
  description: 'Actor: attacker with a stolen credential accessing the vault. Prerequisite: Microsoft Defender for Key Vault not enabled on the subscription. Action: makes unusual access or abuse patterns against the vault. Impact: no alert triggers, so misuse runs until discovered elsewhere. Quelle: MCSB v2 LT-1; baseline feature „Microsoft Defender for Service“; Enable Microsoft Defender for Key Vault.'
- id: sa-public-network-reachable
  name: Storage Account Reachable From Public Networks
  description: 'Actor: external attacker or holder of a leaked credential. Prerequisite: public network access enabled and the firewall default action is Allow. Action: sends requests to the account endpoint from the internet. Impact: reads, changes or exfiltrates data from any data service in the account. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Disable public network access to the storage account“.'
- id: sa-shared-key-authorization
  name: Storage Account Shared Key Credential Abuse
  description: 'Actor: anyone who obtains an account key from code, logs or a configuration file. Prerequisite: Shared Key authorization allowed on the account. Action: signs requests with the account key. Impact: full control of all data services in the account, not scoped to a user, and SAS tokens can be issued without audit. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Disallow Shared Key authorization“.'
- id: sa-long-lived-sas
  name: Storage Account Long-Lived Shared Access Signature
  description: 'Actor: attacker holding a SAS token from a log, URL or repository. Prerequisite: SAS issued with long expiry, broad permissions, or without a stored access policy. Action: uses the SAS within its validity. Impact: data access that cannot be revoked individually when signed with the account key. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Scope every SAS to the minimum permissions and shortest lifetime required“.'
- id: sa-broad-data-plane-role
  name: Storage Data Role Assigned at Account Scope
  description: 'Actor: insider or compromised identity with a storage role. Prerequisite: data-plane role such as Storage Blob Data Owner assigned at account or subscription scope. Action: reads, overwrites or deletes data in every container and share. Impact: access far beyond the workload''s need. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Assign RBAC roles at the smallest reasonable scope“.'
- id: sa-unencrypted-transport
  name: Storage Account Accepts Unencrypted or Legacy-TLS Requests
  description: 'Actor: attacker on the network path or a client with legacy settings. Prerequisite: secure transfer not required, or minimum TLS version below 1.2. Action: intercepts or downgrades the connection. Impact: credentials and data are readable on the wire. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Require secure transfer (HTTPS)“.'
- id: sa-no-customer-managed-key
  name: Storage Account Encrypted Only With Microsoft-Managed Keys
  description: 'Actor: regulator or internal risk owner. Prerequisite: regulated data stored with platform-managed keys only. Action: cannot rotate, audit or revoke the encryption key independently. Impact: compliance gap, and no customer-side way to cut off access to data at rest. Quelle: MCSB v2 DP-5; Secure your Azure Storage account, „Data protection“ / „Configure customer-managed keys (CMK) for encryption at rest“.'
- id: sa-cross-tenant-copy
  name: Storage Data Copied Across Tenant Boundaries
  description: 'Actor: user with data-plane write permission in another tenant. Prerequisite: copy or object replication allowed from source accounts in any tenant. Action: copies or replicates data out of the organization''s tenant. Impact: data leaves the organization''s control through a legitimate-looking operation. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Restrict cross-tenant object replication and copy operations“.'
- id: sa-no-threat-detection
  name: Storage Account Threats Not Detected
  description: 'Actor: attacker performing credential misuse, malware upload or data exfiltration. Prerequisite: Microsoft Defender for Storage not enabled on the subscription or account. Action: performs anomalous or malicious access against blobs, files, queues or tables. Impact: misuse continues without an alert and malware is served to downstream consumers. Quelle: MCSB v2 LT-1, LT-4; Secure your Azure Storage account, „Logging and monitoring“ / „Enable Microsoft Defender for Storage“.'
- id: sa-unlogged-requests
  name: Storage Requests Not Logged or Not Attributable
  description: 'Actor: attacker or insider reading or deleting data. Prerequisite: diagnostic settings absent for the account or its data services. Action: performs reads, writes and deletes without a trace. Impact: no evidence for investigation and no way to tell which authorization method was used. Quelle: MCSB v2 LT-1, LT-4; Secure your Azure Storage account, „Logging and monitoring“ / „Send diagnostic settings to a Log Analytics workspace“.'
- id: sa-accidental-or-malicious-deletion
  name: Storage Account or Data Deleted Without Recovery
  description: 'Actor: administrator error, insider or ransomware with account rights. Prerequisite: no resource lock on the account and no recovery features configured for the data. Action: deletes the account or its data. Impact: data loss that geo-replication would mirror rather than prevent. Quelle: MCSB v2 DP-5; Secure your Azure Storage account, „Data protection“ / „Protect the storage account with a resource lock“.'
- id: avd-hostpool-mi-overprivileged
  name: Host Pool Managed Identity Reads More Secrets Than Needed
  description: 'Actor: attacker who compromises the host pool managed identity or its workload. Prerequisite: managed identity holds Key Vault Secrets User on the whole vault, or an access policy with Get on all secrets. Action: reads every secret in the vault, including unrelated application secrets. Impact: domain-join and local administrator credentials plus unrelated secrets are exposed. Quelle: Deploy Azure Virtual Desktop, Prerequisites: Key Vault RBAC role Key Vault Secrets User for the host pool managed identity.'
- id: avd-hostpool-activity-unlogged
  name: Host Pool Changes Not Logged
  description: 'Actor: insider or attacker with Desktop Virtualization Contributor. Prerequisite: host pool diagnostic settings not enabled. Action: changes host pool properties, registers session hosts or changes assignments. Impact: changes cannot be attributed or detected, and incidents cannot be reconstructed. Quelle: Deploy Azure Virtual Desktop, Management tab: enable diagnostic settings for the host pool.'
- id: avd-hostpool-domain-join-overprivileged
  name: Domain Join Account With Extended Rights on the Session Host OU
  description: 'Actor: attacker who obtains the domain join account from the Key Vault or from automation. Prerequisite: join account holds reset password, validated writes and account restriction rights on all computer objects in the session host OU. Action: resets passwords of computer objects or takes over existing session host computer accounts. Impact: lateral movement across the session host OU and access to user sessions. Quelle: Deploy Azure Virtual Desktop, Prerequisites: AD DS permissions for the domain join account on the OU containing session hosts (KB5020276 computer account reuse).'
- id: avd-hostpool-registration-token-exposure
  name: Host Pool Registration Token Retrieved to Register a Rogue Session Host
  description: 'Actor: insider or attacker with a role that can retrieve the host pool registration token. Prerequisite: Desktop Virtualization Virtual Machine Contributor or Host Pool Contributor assigned on the host pool or a parent scope. Action: retrieves the registration token and registers an attacker-controlled VM as a session host. Impact: user sessions and entered credentials are routed to the attacker-controlled host. Quelle: Built-in Azure RBAC roles for AVD: hostpools/retrieveRegistrationToken in Desktop Virtualization Virtual Machine Contributor and Host Pool Contributor; Session Host Operator: valid registration token.'
- id: avd-sh-internet-egress
  name: Session Hosts With Unrestricted Internet Egress
  description: 'Actor: malware or an attacker inside a user session. Prerequisite: session hosts can reach any internet resource, with no firewall, NVA or proxy. Action: downloads payloads, contacts command-and-control servers or uploads data to external storage. Impact: data exfiltration and persistent remote control of session hosts. Quelle: Security recommendations for Azure Virtual Desktop: by default, session hosts can connect to any resource on the internet.'
- id: avd-sh-local-admin-exposure
  name: Azure Virtual Desktop Session Host Local Admin Exposure
  description: 'Actor: attacker who compromises one session host. Prerequisite: local administrator password is static or shared across session hosts. Action: reuses the local administrator credentials on other session hosts. Impact: administrative rights on all session hosts and access to all user sessions. Quelle: Identity and access management recommendations for AVD: secure local admin accounts (LAPS).'
- id: avd-sh-user-local-admin
  name: Users Granted Administrator Rights on Session Hosts
  description: 'Actor: authenticated user with local administrator rights. Prerequisite: users are members of the local Administrators group or can install software. Action: installs unmanaged software or disables security controls. Impact: malware persistence, tampering with endpoint protection and access to other users'' data. Quelle: Security recommendations for Azure Virtual Desktop: do not grant users admin access to virtual desktops; use configuration management such as Intune.'
- id: avd-sh-no-endpoint-protection
  name: Session Hosts Without Endpoint Protection or EDR
  description: 'Actor: malware delivered by phishing or a malicious download. Prerequisite: no endpoint protection or EDR on the session host. Action: executes payloads and moves between sessions undetected. Impact: compromise of shared multi-session hosts and of all users on them. Quelle: Security recommendations for Azure Virtual Desktop: enable endpoint protection and install an EDR product on all session hosts.'
- id: avd-sh-outdated-image
  name: Session Hosts Built From Unpatched Images
  description: 'Actor: attacker with a public exploit for an unpatched component. Prerequisite: base image or application stack is not patched on a monthly cycle. Action: exploits a known vulnerability on a session host. Impact: privilege escalation to SYSTEM and access to all sessions on that host. Quelle: Security recommendations for Azure Virtual Desktop: patch base images monthly.'
- id: avd-sh-idle-session-unlocked
  name: Idle Sessions Not Locked or Disconnected
  description: 'Actor: person with physical or shared-desk access to an unattended device. Prerequisite: no idle timeout or screen lock configured for sessions. Action: uses a session that is still signed in. Impact: access to open applications, files and data of the previous user. Quelle: Security recommendations for Azure Virtual Desktop: maximum inactive time, disconnection policies and screen locks for idle sessions.'
- id: avd-sh-direct-rdp-exposure
  name: Azure Virtual Desktop Direct RDP Exposure
  description: 'Actor: external attacker or attacker on the internal network. Prerequisite: session hosts reachable via RDP, or permanent RDP access granted to administrators. Action: brute-forces RDP credentials or uses an open RDP path. Impact: interactive access to session hosts outside the AVD gateway. Quelle: Security and governance (CAF) for AVD: use just-in-time access and avoid direct RDP access to session hosts.'
- id: avd-workspace-sign-in-without-mfa
  name: Azure Virtual Desktop Sign-In Without MFA
  description: 'Actor: attacker with a stolen password. Prerequisite: no Conditional Access policy requires MFA for the Azure Virtual Desktop and Windows Cloud Login apps. Action: signs in to the workspace feed and launches desktops and applications. Impact: access to all published desktops and applications of the user. Quelle: Enforce Microsoft Entra MFA for AVD using Conditional Access; Security recommendations for AVD: implement conditional access and MFA.'
- id: avd-workspace-contributor-overprivileged
  name: Workspace Changed by Broad Workspace Contributor Assignment
  description: 'Actor: insider or attacker with Desktop Virtualization Workspace Contributor above the workspace scope. Prerequisite: the role is assigned on a resource group or subscription instead of the workspace. Action: changes workspace configuration and the application groups registered to it. Impact: users are shown unintended desktops or applications. Quelle: Built-in Azure RBAC roles for AVD: Desktop Virtualization Workspace Contributor (workspaces/*, applicationgroups/read).'
- id: avd-workspace-default-desktop-group
  name: Default Desktop Application Group Registered to the Workspace
  description: 'Actor: user who receives the workspace feed. Prerequisite: the portal created the default desktop application group and registered it to the workspace. Action: launches the full desktop instead of only the needed applications. Impact: users receive access to the full session host desktop and its data. Quelle: Deploy Azure Virtual Desktop: a Desktop application group is created automatically and can be registered to the workspace.'
- id: avd-appgroup-desktop-type-broad-exposure
  name: Desktop-Type Application Group Assigned to a Broad Group
  description: 'Actor: insider or external user in a broad assigned group. Prerequisite: desktop-type application group assigned to an all-users or large group where RemoteApp would suffice. Action: uses the full desktop instead of single applications. Impact: larger attack surface and access to data outside the job role. Quelle: Deploy Azure Virtual Desktop: preferred application group type can be set to Desktop or RemoteApp.'
- id: avd-appgroup-owner-role-assignment
  name: Owner or User Access Administrator Can Grant Application Group Access
  description: 'Actor: administrator with Owner or User Access Administrator on the application group. Prerequisite: roleAssignments/write permission on the application group, which these roles include. Action: adds users or groups to the application group. Impact: unreviewed access to published desktops and applications. Quelle: Deploy Azure Virtual Desktop, Prerequisites: assigning users to an application group requires roleAssignments/write; Built-in Azure RBAC roles for AVD: user assignment needs User Access Administrator.'
- id: avd-appgroup-contributor-overprivileged
  name: Application Group Changed by Broad Application Group Contributor Assignment
  description: 'Actor: insider or attacker with Desktop Virtualization Application Group Contributor above the application group. Prerequisite: role inherited from a resource group or subscription. Action: adds, removes or changes published applications and application group properties. Impact: published resources change without review. Quelle: Built-in Azure RBAC roles for AVD: Desktop Virtualization Application Group Contributor (applicationgroups/* apart from user or group assignment).'
- id: avd-scaling-plan-broad-vm-rights
  name: Scaling Plan Service Principal With Subscription-Wide VM Rights
  description: 'Actor: attacker who compromises the Azure Virtual Desktop service principal or the host pool managed identity. Prerequisite: Power On Off Contributor and Virtual Machine Contributor assigned at subscription scope. Action: creates, deletes, starts or stops any virtual machine in the subscription. Impact: destruction of session hosts and of unrelated workloads in the same subscription. Quelle: Create and assign an autoscale scaling plan for AVD: Power On Off Contributor and Virtual Machine Contributor on the service principal with the subscription as assignable scope.'
- id: avd-scaling-plan-session-host-deletion
  name: Scaling Plan Deletes Session Hosts Without Review
  description: 'Actor: attacker or misconfiguration that changes the scaling plan. Prerequisite: dynamic scaling with rights to create and delete session hosts. Action: deletes running session hosts or stops them during business hours. Impact: loss of desktop availability for all users of the host pool. Quelle: Built-in Azure RBAC roles for AVD: Desktop Virtualization Virtual Machine Contributor includes virtualMachines/delete and hostpools/sessionhosts/delete.'
- id: avd-scaling-plan-default-session-limit
  name: Default Max Session Limit Overloads Session Hosts
  description: 'Actor: load generated by many users or a scripted client. Prerequisite: host pool keeps the default MaxSessionLimit, which autoscale requires to be configured. Action: places too many sessions on too few session hosts. Impact: degraded or unavailable desktops for all users on the host pool. Quelle: Create and assign an autoscale scaling plan for AVD, Prerequisites: configure MaxSessionLimit and do not use the default value.'
- id: avd-scaling-plan-power-role-session-logoff
  name: Power On Off Contributor Can Sign Out Users and Change Host Pools
  description: 'Actor: attacker or insider who holds Desktop Virtualization Power On Off Contributor. Prerequisite: role assigned on the subscription, resource group or host pool that holds the scaled host pools. Action: deletes user sessions, sends messages to users, and writes host pool and session host settings. Impact: unsaved user work is lost and host pool configuration changes without a deployment record. Quelle: Built-in Azure RBAC roles for AVD: Desktop Virtualization Power On Off Contributor includes hostpools/write, sessionhosts/write and usersessions/delete.'
- id: avd-fslogix-av-exclusion-hides-malware
  name: Antivirus Exclusions for Profile Containers Hide Malware
  description: 'Actor: malware author with access to a user profile. Prerequisite: antivirus excludes all FSLogix profile container extensions or folders without scoping. Action: stores and runs payloads inside the mounted profile container. Impact: malware persists across sessions and bypasses endpoint protection. Quelle: Security recommendations for AVD: exclude FSLogix profile extensions from antivirus; FSLogix prerequisites: configure antivirus file and folder exclusions.'
- id: avd-fslogix-share-public-access
  name: Profile Share Reachable From Public Networks
  description: 'Actor: external attacker or holder of a leaked credential. Prerequisite: the Azure Files share that holds the profile containers allows public network access. Action: connects to the profile share from the internet. Impact: reads or modifies all user profile containers. Quelle: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Disable public network access to the storage account“.'
- id: avd-fslogix-shared-key-access
  name: Profile Share Accessed With Storage Account Key
  description: 'Actor: attacker who obtains the storage account key from a script or log. Prerequisite: Shared Key authorization allowed on the storage account that holds profile containers. Action: mounts or reads profile containers with the account key. Impact: access to every user profile without user-level audit. Quelle: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Disallow Shared Key authorization“.'
- id: azure-flow-plaintext-transport
  name: Data Flow Sent Without Encryption or With Legacy TLS
  description: 'Actor: attacker on the network path or on a shared network segment. Prerequisite: the flow uses plaintext, secure transfer is off, or the minimum TLS version is below 1.2. Action: reads the traffic as it crosses the network. Impact: data and credentials in transit are disclosed. Quelle: Secure-Azure-Storage-account, Require secure transfer (HTTPS) and minimum TLS 1.2 (MCSB v2 DP-3, NS-2); Azure Policy: Azure SQL Database and PostgreSQL flexible servers should use TLS 1.2 or newer.'
- id: azure-flow-mitm-network-path
  name: Data Flow Intercepted on the Network Path
  description: 'Actor: attacker with access to a network segment between the two endpoints. Prerequisite: the flow reaches the service over a public endpoint or an unverified route, without private connectivity. Action: intercepts the connection and presents a forged endpoint or certificate. Impact: the client sends credentials or data to the attacker. Quelle: MCSB v2 NS-2 (secure cloud network: private connectivity); Learn: Azure Private Link and private endpoints.'
- id: azure-flow-token-replay
  name: Authentication Token Replayed Over a Data Flow
  description: 'Actor: attacker who captures a bearer token, SAS token or refresh token from a log, a proxy or the network. Prerequisite: tokens have long lifetimes or are not bound to a session or a client. Action: replays the token to call the service as the original identity. Impact: unauthorized access under a valid identity. Quelle: MCSB v2 IM-7 (restrict resource access) and IM-1 (centralize identity); Learn: Continuous access evaluation and token protection in Microsoft Entra ID.'
- id: azure-flow-message-tampering
  name: Messages Tampered With or Replayed on a Messaging Flow
  description: 'Actor: attacker with a shared access key or a stolen local credential for the messaging namespace. Prerequisite: local authentication (keys) enabled on the namespace, and no Entra authorization enforced. Action: publishes, reads or alters messages, or replays old messages. Impact: downstream services act on forged or duplicated work items. Quelle: Azure Policy: Service Bus and Event Hubs namespaces should have local authentication disabled; MCSB v2 IM-1 (identity) and DP-3 (data in transit).'
- id: azure-flow-input-injection
  name: Malicious Input Sent Over an Entry Flow
  description: 'Actor: external attacker sending crafted requests to an entry point. Prerequisite: the entry point forwards requests without inspection or validation. Action: sends SQL, script or header payloads over HTTP or HTTPS. Impact: the backend executes or stores malicious input. Quelle: MCSB v2 NS-10 (web application protection) and PV-2 (secure configuration of compute); Azure Policy: App Service web apps should use Web Application Firewall (WAF).'
- id: azure-flow-smb-relay
  name: SMB or Kerberos Session Relayed Over a File Flow
  description: 'Actor: attacker on the network who can coerce authentication from a client. Prerequisite: SMB signing is not required, or the share accepts unauthenticated or NTLM sessions. Action: relays the client''s authentication to another server or share. Impact: access to the share or to another service with the client''s identity. Quelle: MCSB v2 IM-7 and NS-2; Learn: Azure Files identity-based authentication and SMB encryption.'
