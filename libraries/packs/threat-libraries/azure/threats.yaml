threats:
- id: azure-files-shared-key-exposure
  name: Azure Files Storage Account Key or SAS Exposure
  description: 'Storage account access keys or long-lived SAS tokens leak through source code, logs, tickets, or shared scripts. Holders gain full data-plane access to all shares and bypass share-level RBAC and NTFS ACLs. Quelle: MCSB v2 IM-8 (Restrict the exposure of credentials and secrets); MITRE ATT&CK T1552.001.'
- id: azure-files-rbac-acl-misconfiguration
  name: Azure Files RBAC and NTFS ACL Misalignment
  description: 'Share-level RBAC roles such as Storage File Data SMB Share Elevated Contributor are granted to broad groups or combined with permissive NTFS ACLs. Users receive write or ACL-change rights they should not have. Quelle: MCSB v2 IM-7 (Restrict resource access based on conditions), PA-7 (Follow just enough administration (least privilege) principle); MITRE ATT&CK T1078.004.'
- id: azure-files-public-exposure
  name: Azure Files Public Network Exposure
  description: 'The storage account is reachable from the public internet through public network access or a default-allow firewall. Stolen credentials can be used from anywhere, and bulk data can be exfiltrated without network controls. Quelle: MCSB v2 NS-2 (Secure cloud native services with network controls), NS-9 (Connect on-premises or cloud network privately); MITRE ATT&CK T1530.'
- id: azure-files-unencrypted-transfer
  name: Azure Files Unencrypted SMB Transfer
  description: 'Clients connect with SMB 2.x or without encryption, so file contents and credential exchanges can be read or captured by anyone on the network path. Quelle: MCSB v2 DP-3 (Encrypt sensitive data in transit); MITRE ATT&CK T1040.'
- id: azure-files-data-destruction
  name: Azure Files Data Destruction
  description: 'Attackers with delete rights remove shares or files without a recovery point, or disable soft delete. Ransomware that encrypts share contents then has no restore path. Quelle: MCSB v2 BR-2 (Protect backup and recovery data), BR-1 (Ensure regular automated backups); MITRE ATT&CK T1485.'
- id: azure-files-undetected-access
  name: Azure Files Unlogged Access
  description: 'Share access and administrative operations are not logged or not forwarded, so misuse of shared data cannot be attributed or investigated. Quelle: MCSB v2 LT-3 (Enable logging for security investigation), DP-2 (Monitor anomalies and threats targeting sensitive data); MITRE ATT&CK T1070.'
- id: anf-nfs-export-exposure
  name: Azure NetApp Files NFS Export Over-Exposure
  description: 'The export policy allows broad CIDR ranges or any host and relies on AUTH_SYS, which trusts client-supplied UIDs. Any host that can reach the subnet can mount the volume and impersonate any user. Quelle: MCSB v2 NS-2 (Secure cloud native services with network controls), IM-7 (Restrict resource access based on conditions); MITRE ATT&CK T1021.'
- id: anf-dual-protocol-permission-mismatch
  name: Azure NetApp Files Dual-Protocol Permission Mismatch
  description: 'Dual-protocol volumes with mixed security styles let NTFS ACLs and UNIX mode bits conflict. Users may gain write access through the less restrictive protocol, creating silent privilege escalation. Quelle: MCSB v2 IM-7 (Restrict resource access based on conditions), PA-7 (Follow just enough administration (least privilege) principle); MITRE ATT&CK T1078.004.'
- id: anf-snapshot-deletion
  name: Azure NetApp Files Snapshot and Backup Destruction
  description: 'Ransomware or an operator with Contributor rights deletes volumes, snapshots, or backup vault copies, removing recovery points. Snapshot policies alone do not protect against principals who hold delete rights. Quelle: MCSB v2 BR-2 (Protect backup and recovery data), BR-1 (Ensure regular automated backups); MITRE ATT&CK T1490.'
- id: anf-unmanaged-encryption-keys
  name: Azure NetApp Files Platform-Only Key Control
  description: 'Volumes use platform-managed keys only, so the organization cannot revoke access to data at rest or demonstrate key custody for regulated workloads. Quelle: MCSB v2 DP-4 (Enable data at rest encryption by default), DP-5 (Use customer-managed key option in data at rest encryption when required); MITRE ATT&CK T1530.'
- id: anf-network-activity-unlogged
  name: Azure NetApp Files Unlogged Network Activity
  description: 'Mounts and NFS traffic to the delegated subnet are not logged, so unauthorized mounts and data access leave no trace. Quelle: MCSB v2 LT-4 (Enable network logging for security investigation); MITRE ATT&CK T1070.'
- id: entra-token-theft
  name: Entra ID Session Cookie and Refresh Token Theft
  description: 'Adversary-in-the-middle phishing kits or infostealer malware capture session cookies and refresh tokens. Attackers replay them to bypass MFA and impersonate users, including administrators. Quelle: MCSB v2 IM-6 (Use strong authentication controls), LT-2 (Enable threat detection for identity and access management); MITRE ATT&CK T1539, T1528.'
- id: entra-password-spraying
  name: Entra ID Password Spraying
  description: 'Low-and-slow password attempts across many accounts evade per-account lockout. Weak or leaked passwords are then used to sign in. Quelle: MCSB v2 IM-6 (Use strong authentication controls); MITRE ATT&CK T1110.003.'
- id: entra-conditional-access-bypass
  name: Entra ID Conditional Access Bypass
  description: 'Conditional Access is circumvented through legacy authentication protocols, the device code flow, excluded accounts, broad trusted named locations, or non-compliant clients. Quelle: MCSB v2 IM-7 (Restrict resource access based on conditions); MITRE ATT&CK T1078.004.'
- id: entra-standing-admin-access
  name: Entra ID Standing Privileged Access
  description: 'Administrators hold permanent privileged role assignments. A single compromised session gives an attacker standing administrative control without any approval or time limit. Quelle: MCSB v2 PA-2 (Avoid standing access for user accounts and permissions), PA-6 (Use privileged access solution); MITRE ATT&CK T1078.004.'
- id: entra-break-glass-misuse
  name: Entra ID Emergency Access Account Misuse
  description: 'Emergency access accounts are weakly protected or their use is not monitored, so an attacker who finds them has an unmonitored path to tenant-wide administrative rights. Quelle: MCSB v2 PA-5 (Set up emergency access); MITRE ATT&CK T1078.004.'
- id: entra-service-principal-abuse
  name: Entra ID Service Principal Credential Abuse
  description: 'Service principals with long-lived client secrets or certificates, or with high-privilege Microsoft Graph application permissions, are compromised. Attackers add credentials to existing apps for persistent access. Quelle: MCSB v2 IM-3 (Manage application identities securely and automatically), IM-8 (Restrict the exposure of credentials and secrets); MITRE ATT&CK T1098.001, T1528.'
- id: entra-consent-phishing
  name: Entra ID OAuth Consent Phishing
  description: 'Users are tricked into granting a malicious multi-tenant application access to mail or files. The app keeps access without a password or MFA challenge. Quelle: MCSB v2 IM-5 (Use single sign-on (SSO) for application access); MITRE ATT&CK T1528.'
- id: entra-provider-access-abuse
  name: Entra ID Cloud Provider Support Access Abuse
  description: 'Provider support staff or an unrestricted support process gains access to customer tenants or data without customer approval. Quelle: MCSB v2 PA-8 (Determine access process for cloud provider support); MITRE ATT&CK T1078.004.'
- id: appservice-managed-identity-ssrf-abuse
  name: App Service Managed Identity Token Theft via SSRF
  description: 'A server-side request forgery flaw in the web app queries the Azure Instance Metadata Service and returns managed identity tokens. The tokens then reach Key Vault, storage, or databases with the application''s permissions. Quelle: MCSB v2 IM-3 (Manage application identities securely and automatically), NS-2 (Secure cloud native services with network controls); MITRE ATT&CK T1552.005.'
- id: appservice-remote-code-execution
  name: App Service Remote Code Execution
  description: 'Injection flaws or vulnerable dependencies in the App Service workload allow code execution in the worker. From there, attackers reach managed identity tokens, app settings, and connected data stores. Quelle: MCSB v2 PV-6 (Rapidly and automatically remediate vulnerabilities); MITRE ATT&CK T1190.'
- id: appservice-scm-exposure
  name: App Service SCM and Publishing Credential Exposure
  description: 'The SCM (Kudu) endpoint and basic-auth FTP or publishing credentials are reachable from the internet. Leaked publish profiles allow code deployment and disclosure of app settings. Quelle: MCSB v2 NS-2 (Secure cloud native services with network controls), IM-4 (Authenticate server and services); MITRE ATT&CK T1078.'
- id: appservice-insecure-transport
  name: App Service Insecure Transport
  description: 'HTTP access or outdated TLS versions are allowed, so session tokens and credentials can be intercepted on the network path. Quelle: MCSB v2 DP-3 (Encrypt sensitive data in transit); MITRE ATT&CK T1040.'
- id: appservice-secrets-in-settings
  name: App Service Plaintext Secrets in Configuration
  description: 'Secrets are stored as plaintext app settings or in deployment templates, where any reader of the app configuration can extract them. Quelle: MCSB v2 IM-8 (Restrict the exposure of credentials and secrets); MITRE ATT&CK T1552.001.'
- id: appservice-unmonitored-requests
  name: App Service Unlogged Requests
  description: 'HTTP requests, application errors, and SCM access are not logged, so SSRF probing and exploitation attempts are not visible. Quelle: MCSB v2 LT-3 (Enable logging for security investigation); MITRE ATT&CK T1070.'
- id: managed-identity-overprivileged
  name: Over-Privileged Azure Managed Identity
  description: 'A system-assigned or user-assigned managed identity holds broad roles such as Owner, Contributor, or subscription-wide access, and is shared across workloads. Compromise of any consumer yields control over everything the identity can reach. Quelle: MCSB v2 PA-7 (Follow just enough administration (least privilege) principle), IM-3 (Manage application identities securely and automatically); MITRE ATT&CK T1078.004.'
- id: managed-identity-role-changes-unmonitored
  name: Unmonitored Managed Identity Role Changes
  description: 'Role assignments to managed identities are granted or widened without review or alerting, so privilege growth stays invisible. Quelle: MCSB v2 PA-4 (Review and reconcile user access regularly), LT-1 (Enable threat detection capabilities); MITRE ATT&CK T1098.'
- id: vm-management-port-exposure
  name: Azure VM RDP and SSH Exposure
  description: 'TCP 3389 or 22 is open to the internet on virtual machines. Attackers brute-force or spray credentials and, after a successful logon, escalate on the host. Quelle: MCSB v2 NS-8 (Detect and disable insecure services and protocols), NS-1 (Establish network segmentation boundaries); MITRE ATT&CK T1021, T1110.001.'
- id: vm-unpatched-os-exploitation
  name: Azure VM Unpatched Operating System Exploitation
  description: 'Missing security updates leave the guest OS exposed to known local and remote privilege escalation exploits. Attackers use these after initial access to gain SYSTEM or root. Quelle: MCSB v2 PV-6 (Rapidly and automatically remediate vulnerabilities), PV-5 (Perform vulnerability assessments); MITRE ATT&CK T1068.'
- id: vm-configuration-drift
  name: Azure VM Insecure Configuration Drift
  description: 'VMs drift away from the hardened baseline (services, firewall, audit policy), creating weaknesses that are never reported or corrected. Quelle: MCSB v2 PV-3 (Define and establish secure configurations for compute resources), PV-4 (Audit and enforce secure configurations for compute resources); MITRE ATT&CK T1059.'
- id: vm-no-endpoint-protection
  name: Azure VM Without EDR or Antimalware
  description: 'VMs without EDR or antimalware protection, or with tamper protection disabled, let malware and living-off-the-land activity run without detection. Quelle: MCSB v2 ES-1 (Use Endpoint Detection and Response (EDR)), ES-2 (Use modern anti-malware software); MITRE ATT&CK T1059.'
- id: vm-disk-snapshot-exfiltration
  name: Azure VM Disk and Snapshot Exfiltration
  description: 'Managed disks or snapshots are publicly accessible or exportable through an unrestricted SAS. Attackers generate a download link and copy the disk contents to an external storage account. Quelle: MCSB v2 DP-4 (Enable data at rest encryption by default), DP-5 (Use customer-managed key option in data at rest encryption when required); MITRE ATT&CK T1537.'
- id: vm-extension-code-execution
  name: Azure VM Extension Code Execution
  description: 'A malicious or unauthorized VM extension, such as a Custom Script Extension pointing to an attacker-controlled URL, runs code as SYSTEM or root on the VM and persists across reboots. Quelle: MCSB v2 PV-4 (Audit and enforce secure configurations for compute resources), AM-5 (Use only approved applications in virtual machine); MITRE ATT&CK T1059.'
- id: vm-backup-destruction
  name: Azure VM Backup Destruction
  description: 'Attackers delete recovery points or disable backup protection for VMs before encrypting or destroying them, so the VM cannot be restored. Quelle: MCSB v2 BR-1 (Ensure regular automated backups), BR-2 (Protect backup and recovery data); MITRE ATT&CK T1490.'
- id: sql-database-public-exposure
  name: 'Azure SQL Database: public exposure'
  description: 'Azure SQL Database ist aus dem öffentlichen Netz erreichbar oder lässt Zugriff über Standardregeln zu. Angreifer mit gestohlenen oder erratenen Zugangsdaten können von überall zugreifen. Quelle: MCSB v2 NS-2; Azure Policy: Public network access on Azure SQL Database should be disabled; MITRE ATT&CK T1530.'
- id: sql-database-transport
  name: 'Azure SQL Database: transport'
  description: 'Die Verbindung zu Azure SQL Database kann unverschlüsselt oder mit veralteter TLS-Version aufgebaut werden. Zugangsdaten und Daten können auf dem Netzpfad mitgelesen werden. Quelle: MCSB v2 DP-3, IM-4; Azure Policy: Azure SQL Database should be running TLS version 1.2 or newer; Enforce SSL connection should be enabled for MySQL database servers; Enforce SSL connection should be enabled for PostgreSQL database servers; MITRE ATT&CK T1040.'
- id: sql-database-authentication
  name: 'Azure SQL Database: authentication'
  description: 'Der Zugriff auf Azure SQL Database stützt sich auf schwache Authentifizierung, etwa lokale Konten, Schlüssel oder Passwörter ohne Entra-ID-Bindung. Quelle: MCSB v2 IM-1; Azure Policy: Azure SQL Database should have Microsoft Entra-only authentication enabled; Azure SQL Database should have Microsoft Entra-only authentication enabled during creation; MITRE ATT&CK T1078.004.'
- id: sql-database-backup
  name: 'Azure SQL Database: backup'
  description: 'Daten oder Konfiguration von Azure SQL Database lassen sich ohne ausreichende Sicherung, Aufbewahrung oder Schutz vor Löschung verlieren oder zerstören. Quelle: MCSB v2 BR-1; Azure Policy: Long-term geo-redundant backup should be enabled for Azure SQL Databases; MITRE ATT&CK T1485.'
- id: sql-database-vulnerable-config
  name: 'Azure SQL Database: vulnerable config'
  description: 'Azure SQL Database läuft mit unsicherer Konfiguration oder veralteten Komponenten. Bekannte Schwachstellen können ausgenutzt werden. Quelle: MCSB v2 DP-2, IR-3, IR-5, LT-1, LT-2, PV-6; Azure Policy: Azure Defender for Azure SQL Database servers should be enabled; SQL databases should have vulnerability findings resolved; MITRE ATT&CK T1190.'
- id: cosmosdb-public-exposure
  name: 'Azure Cosmos DB: public exposure'
  description: 'Azure Cosmos DB ist aus dem öffentlichen Netz erreichbar oder lässt Zugriff über Standardregeln zu. Angreifer mit gestohlenen oder erratenen Zugangsdaten können von überall zugreifen. Quelle: MCSB v2 NS-2; Azure Policy: Azure Cosmos DB should disable public network access; MITRE ATT&CK T1530.'
- id: cosmosdb-encryption
